<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>网页白板 · 圈选擦除</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 主画布 */
  #board {
    position: fixed; inset: 0; display: block;
    touch-action: none;
    cursor: crosshair;
  }

  /* 预览层（只用来画套索的虚线圈，不参与实际绘制） */
  #preview {
    position: fixed; inset: 0; display: block;
    pointer-events: none;
    touch-action: none;
  }

  /* ===== 底部单排工具栏（电脑版：整体放大 10%） ===== */
  .toolbar {
    position: fixed;
    bottom: 18px;                 /* 16px × 1.1 */
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;                     /* 4.4px 取整 */
    flex-wrap: nowrap;
    overflow-x: auto;
    max-width: calc(100vw - 16px);
    padding: 8px 11px;            /* 7.7px 11px */
    background: rgba(255,255,255,.85);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.05);
    user-select: none;
    z-index: 10;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .toolbar::-webkit-scrollbar { display: none; }

  /* 图标按钮（电脑版放大 10%） */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 42px;                  /* 38 × 1.1 ≈ 42 */
    height: 42px;
    padding: 0;
    font-size: 21px;              /* 19 × 1.1 ≈ 21 */
    line-height: 1;
    color: #374151;
    background: transparent;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: background .15s, transform .1s, color .15s;
  }
  .btn:hover { background: rgba(0,0,0,.07); }
  .btn:active { transform: scale(.9); }
  .btn.active {
    background: #3b82f6;
    color: #fff;
    box-shadow: 0 2px 8px rgba(59,130,246,.45);
  }
  .btn.active:hover { background: #2563eb; }

  .divider {
    flex: none;
    width: 1px; height: 24px;     /* 22 × 1.1 ≈ 24 */
    background: rgba(0,0,0,.12);
    margin: 0 4px;
  }

  /* 颜色选择（圆形色块，电脑版放大 10%） */
  input[type="color"] {
    -webkit-appearance: none; appearance: none;
    flex: none;
    width: 33px;                  /* 30 × 1.1 = 33 */
    height: 33px;
    margin: 0 4px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: none;
    cursor: pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch {
    border: 3px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 1.5px rgba(0,0,0,.18);
  }
  input[type="color"]::-moz-color-swatch {
    border: 3px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 1.5px rgba(0,0,0,.18);
  }

  /* 粗细滑块（电脑版放大 10%） */
  input[type="range"] {
    flex: none;
    width: 92px;                  /* 84 × 1.1 ≈ 92 */
    margin: 0 4px;
    accent-color: #3b82f6;
    cursor: pointer;
  }
  #sizeLabel {
    flex: none;
    font-size: 14px;              /* 13 × 1.1 ≈ 14 */
    color: #6b7280;
    width: 24px;                  /* 22 × 1.1 ≈ 24 */
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ===== 手机版：在原有小屏尺寸基础上再缩小 10% ===== */
  @media (max-width: 480px) {
    .toolbar {
      bottom: 14px;               /* 原手机版继承的 16px 再 ×0.9 ≈ 14 */
      gap: 3px;                   /* 原手机版 3px 再 ×0.9 ≈ 3 */
      padding: 5px 7px;           /* 原手机版 6px 8px ×0.9 ≈ 5px 7px */
    }
    .btn {
      width: 31px;                /* 原手机版 34px ×0.9 ≈ 31 */
      height: 31px;
      font-size: 15px;            /* 原手机版 17px ×0.9 ≈ 15 */
    }
    .divider {
      height: 20px;               /* 22 × 0.9 ≈ 20 */
      margin: 0 3px;
    }
    input[type="color"] {
      width: 27px;                /* 30 × 0.9 = 27 */
      height: 27px;
      margin: 0 3px;
    }
    input[type="range"] {
      width: 56px;                /* 原手机版 62px ×0.9 ≈ 56 */
      margin: 0 3px;
    }
    #sizeLabel {
      width: 18px;                /* 原手机版 20px ×0.9 = 18 */
      font-size: 11px;            /* 原手机版 12px ×0.9 ≈ 11 */
    }
  }
</style>
</head>
<body>

<canvas id="board"></canvas>
<canvas id="preview"></canvas>

<div class="toolbar">
  <button id="pen"    class="btn active" title="画笔 (B)">✏️</button>
  <button id="eraser" class="btn"        title="圈选擦除 (E)：圈住一块区域，松手即擦掉">⭕</button>
  <span class="divider"></span>
  <input type="color" id="color" value="#1f2937" title="画笔颜色">
  <input type="range" id="size" min="1" max="60" value="2" title="粗细">
  <span id="sizeLabel">2</span>
  <span class="divider"></span>
  <button id="undo"  class="btn" title="撤销 (Ctrl+Z)">↶</button>
  <button id="clear" class="btn" title="清空画布">🗑</button>
  <button id="save"  class="btn" title="保存为 PNG">💾</button>
</div>

<script>
(() => {
  'use strict';

  const canvas  = document.getElementById('board');
  const ctx     = canvas.getContext('2d');
  const preview = document.getElementById('preview');
  const pctx    = preview.getContext('2d');

  /* ================= 状态 ================= */
  let dpr         = 1;
  let tool        = 'pen';     // 'pen' | 'eraser'(圈选擦除)
  let color       = '#1f2937';
  let size        = 2;         // 默认笔号 2（CSS 像素）
  let drawing     = false;
  let lastPoint   = null;
  let activeId    = null;
  let lasso       = null;      // { points: [{x,y}, ...] }
  let initialized = false;

  const history     = [];
  const MAX_HISTORY = 40;

  /* ================= 画布尺寸 / 高清适配 ================= */
  function setupCanvas(keepContent = true) {
    let backup = null;
    if (initialized && keepContent && canvas.width > 0) {
      backup = document.createElement('canvas');
      backup.width  = canvas.width;
      backup.height = canvas.height;
      backup.getContext('2d').drawImage(canvas, 0, 0);
    }

    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = window.innerWidth;
    const h = window.innerHeight;

    canvas.width  = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap  = 'round';
    ctx.lineJoin = 'round';

    preview.width  = canvas.width;
    preview.height = canvas.height;
    preview.style.width  = w + 'px';
    preview.style.height = h + 'px';
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (backup) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(backup, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    lasso = null;
    drawing = false;
    lastPoint = null;

    initialized = true;
    applyTool();
  }

  /* ================= 工具状态 ================= */
  function applyTool() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.fillStyle   = color;
    ctx.lineWidth   = size;
    canvas.style.cursor = 'crosshair';
  }

  function setTool(t) {
    tool = t;
    document.getElementById('pen').classList.toggle('active', t === 'pen');
    document.getElementById('eraser').classList.toggle('active', t === 'eraser');
    lasso = null;
    clearPreview();
    drawing = false;
    lastPoint = null;
    applyTool();
  }

  /* ================= 撤销 ================= */
  function pushHistory() {
    try {
      history.push(canvas.toDataURL('image/png'));
      if (history.length > MAX_HISTORY) history.shift();
    } catch (e) { /* ignore */ }
  }

  function undo() {
    if (!history.length) return;
    const url = history.pop();
    const img = new Image();
    img.onload = () => {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      ctx.restore();
      applyTool();
    };
    img.src = url;
  }

  /* ================= 坐标 ================= */
  function getPoint(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  /* ================= 画笔绘制 ================= */
  function drawDot(p) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(size / 2, 0.5), 0, Math.PI * 2);
    ctx.fill();
  }

  function drawLine(from, to) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.lineWidth = size;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
  }

  /* ================= 圈选擦除 ================= */
  function drawLassoPreview() {
    clearPreview();
    if (!lasso) return;
    const pts = lasso.points;

    if (pts.length < 2) {
      pctx.beginPath();
      pctx.arc(pts[0].x, pts[0].y, 3, 0, Math.PI * 2);
      pctx.fillStyle = 'rgba(59,130,246,.65)';
      pctx.fill();
      return;
    }

    pctx.save();
    pctx.beginPath();
    pctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) pctx.lineTo(pts[i].x, pts[i].y);
    pctx.closePath();

    pctx.fillStyle = 'rgba(59,130,246,.12)';
    pctx.fill();

    pctx.setLineDash([6, 5]);
    pctx.lineWidth = 1.5;
    pctx.strokeStyle = 'rgba(59,130,246,.9)';
    pctx.stroke();
    pctx.restore();
  }

  function clearPreview() {
    pctx.save();
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.clearRect(0, 0, preview.width, preview.height);
    pctx.restore();
  }

  function eraseRegion(pts) {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function eraseDot(p) {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(size / 2, 3), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ================= 指针事件 ================= */
  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (activeId !== null) return;
    e.preventDefault();

    activeId = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

    if (tool === 'eraser') {
      lasso = { points: [getPoint(e)] };
      drawLassoPreview();
      return;
    }

    pushHistory();
    drawing   = true;
    lastPoint = getPoint(e);
    drawDot(lastPoint);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activeId) return;

    if (tool === 'eraser') {
      if (!lasso) return;
      e.preventDefault();
      const evts = (typeof e.getCoalescedEvents === 'function')
        ? e.getCoalescedEvents() : [e];
      for (const ev of evts) lasso.points.push(getPoint(ev));
      drawLassoPreview();
      return;
    }

    if (!drawing) return;
    e.preventDefault();
    const evts = (typeof e.getCoalescedEvents === 'function')
      ? e.getCoalescedEvents() : [e];
    for (const ev of evts) {
      const p = getPoint(ev);
      if (lastPoint) drawLine(lastPoint, p);
      lastPoint = p;
    }
  });

  function endStroke(e) {
    if (e.pointerId !== activeId) return;
    activeId = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}

    if (tool === 'eraser') {
      if (!lasso) return;
      const pts = lasso.points;
      lasso = null;
      clearPreview();

      if (pts.length >= 3) {
        pushHistory();
        eraseRegion(pts);
      } else if (pts.length === 1) {
        pushHistory();
        eraseDot(pts[0]);
      }
      return;
    }

    drawing   = false;
    lastPoint = null;
  }

  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  /* ================= 工具栏交互 ================= */
  const $ = (id) => document.getElementById(id);

  $('pen').addEventListener('click',    () => setTool('pen'));
  $('eraser').addEventListener('click', () => setTool('eraser'));

  $('color').addEventListener('input', (e) => {
    color = e.target.value;
    if (tool !== 'pen') setTool('pen');
    applyTool();
  });

  $('size').addEventListener('input', (e) => {
    size = Number(e.target.value);
    $('sizeLabel').textContent = size;
    applyTool();
  });

  $('undo').addEventListener('click', undo);

  $('clear').addEventListener('click', () => {
    pushHistory();
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    applyTool();
  });

  $('save').addEventListener('click', () => {
    const tmp = document.createElement('canvas');
    tmp.width  = canvas.width;
    tmp.height = canvas.height;
    const tctx = tmp.getContext('2d');
    tctx.fillStyle = '#fff';
    tctx.fillRect(0, 0, tmp.width, tmp.height);
    tctx.drawImage(canvas, 0, 0);

    const a = document.createElement('a');
    a.download = 'whiteboard-' + Date.now() + '.png';
    a.href = tmp.toDataURL('image/png');
    a.click();
  });

  /* ================= 快捷键 ================= */
  window.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z') {
      e.preventDefault();
      undo();
    } else if (k === 'e') {
      setTool('eraser');
    } else if (k === 'b') {
      setTool('pen');
    } else if (k === 'escape') {
      lasso = null;
      clearPreview();
    }
  });

  /* ================= 窗口尺寸变化 ================= */
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => setupCanvas(true), 180);
  });

  /* ================= 启动 ================= */
  setupCanvas(false);
})();
</script>
</body>
</html>
