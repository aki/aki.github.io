<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>网页白板 · 圈选擦除</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 主画布 */
  #board {
    position: fixed; inset: 0; display: block;
    touch-action: none;
    cursor: crosshair;
  }

  /* 预览层（只用来画套索的虚线圈，不参与实际绘制） */
  #preview {
    position: fixed; inset: 0; display: block;
    pointer-events: none;
    touch-action: none;
  }

  /* ===== 底部单排工具栏 ===== */
  .toolbar {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;              /* 强制一排 */
    overflow-x: auto;               /* 太窄时可以横向滑动 */
    max-width: calc(100vw - 16px);
    padding: 7px 12px;
    background: rgba(255,255,255,.85);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.05);
    user-select: none;
    z-index: 10;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .toolbar::-webkit-scrollbar { display: none; }

  .btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 7px 12px; font-size: 14px; line-height: 1;
    color: #374151; background: transparent;
    border: none; border-radius: 999px; cursor: pointer;
    white-space: nowrap; flex: none;
    transition: background .15s, color .15s;
  }
  .btn:hover { background: rgba(0,0,0,.06); }
  .btn.active { background: #3b82f6; color: #fff; }
  .btn.active:hover { background: #2563eb; }

  .divider { flex: none; width: 1px; height: 22px; background: rgba(0,0,0,.12); margin: 0 2px; }

  /* 颜色选择 */
  input[type="color"] {
    -webkit-appearance: none; appearance: none;
    flex: none;
    width: 30px; height: 30px; padding: 0;
    border: none; border-radius: 50%; background: none; cursor: pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch {
    border: 3px solid #fff; border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,.18);
  }
  input[type="color"]::-moz-color-swatch {
    border: 3px solid #fff; border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,.18);
  }

  /* 粗细滑块 */
  input[type="range"] {
    flex: none; width: 84px; accent-color: #3b82f6; cursor: pointer;
  }
  #sizeLabel {
    flex: none;
    font-size: 13px; color: #6b7280; width: 24px;
    text-align: center; font-variant-numeric: tabular-nums;
  }

  @media (max-width: 480px) {
    .btn { padding: 7px 9px; font-size: 13px; }
    input[type="range"] { width: 64px; }
    .toolbar { gap: 4px; padding: 6px 9px; }
  }
</style>
</head>
<body>

<canvas id="board"></canvas>
<canvas id="preview"></canvas>

<div class="toolbar">
  <button id="pen"    class="btn active" title="画笔 (B)">✏️ 画笔</button>
  <button id="eraser" class="btn"        title="圈选擦除 (E)：圈住一块区域，松手即擦掉">⭕ 圈选擦除</button>
  <span class="divider"></span>
  <input type="color" id="color" value="#1f2937" title="画笔颜色">
  <input type="range" id="size" min="1" max="60" value="4" title="粗细">
  <span id="sizeLabel">4</span>
  <span class="divider"></span>
  <button id="undo"  class="btn" title="撤销 (Ctrl+Z)">↶ 撤销</button>
  <button id="clear" class="btn" title="清空画布">🗑 清空</button>
  <button id="save"  class="btn" title="保存为 PNG">💾 保存</button>
</div>

<script>

    let backup = null;

    const h = window.innerHeight;

    canvas.width  = Math.round(w * dpr);
