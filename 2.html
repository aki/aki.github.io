<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>网页白板 · 圈选擦除</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 主画布 */
  #board {
    position: fixed; inset: 0; display: block;
    touch-action: none;
    cursor: crosshair;
  }

  /* 预览层（只用来画套索的虚线圈，不参与实际绘制） */
  #preview {
    position: fixed; inset: 0; display: block;
    pointer-events: none;
    touch-action: none;
  }

  /* ===== 底部单排工具栏 ===== */
  .toolbar {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;              /* 强制一排 */
    overflow-x: auto;               /* 太窄时可以横向滑动 */
    max-width: calc(100vw - 16px);
    padding: 7px 12px;
    background: rgba(255,255,255,.85);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.05);
    user-select: none;
    z-index: 10;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .toolbar::-webkit-scrollbar { display: none; }

  .btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 7px 12px; font-size: 14px; line-height: 1;
    color: #374151; background: transparent;
    border: none; border-radius: 999px; cursor: pointer;
    white-space: nowrap; flex: none;
    transition: background .15s, color .15s;
  }
  .btn:hover { background: rgba(0,0,0,.06); }
  .btn.active { background: #3b82f6; color: #fff; }
  .btn.active:hover { background: #2563eb; }

  .divider { flex: none; width: 1px; height: 22px; background: rgba(0,0,0,.12); margin: 0 2px; }

  /* 颜色选择 */
  input[type="color"] {
    -webkit-appearance: none; appearance: none;
    flex: none;
    width: 30px; height: 30px; padding: 0;
    border: none; border-radius: 50%; background: none; cursor: pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch {
    border: 3px solid #fff; border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,.18);
  }
  input[type="color"]::-moz-color-swatch {
    border: 3px solid #fff; border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,.18);
  }

  /* 粗细滑块 */
  input[type="range"] {
    flex: none; width: 84px; accent-color: #3b82f6; cursor: pointer;
  }
  #sizeLabel {
    flex: none;
    font-size: 13px; color: #6b7280; width: 24px;
    text-align: center; font-variant-numeric: tabular-nums;
  }

  @media (max-width: 480px) {
    .btn { padding: 7px 9px; font-size: 13px; }
    input[type="range"] { width: 64px; }
    .toolbar { gap: 4px; padding: 6px 9px; }
  }
</style>
</head>
<body>

<canvas id="board"></canvas>
<canvas id="preview"></canvas>

<div class="toolbar">
  <button id="pen"    class="btn active" title="画笔 (B)">✏️ 画笔</button>
  <button id="eraser" class="btn"        title="圈选擦除 (E)：圈住一块区域，松手即擦掉">⭕ 圈选擦除</button>
  <span class="divider"></span>
  <input type="color" id="color" value="#1f2937" title="画笔颜色">
  <input type="range" id="size" min="1" max="60" value="4" title="粗细">
  <span id="sizeLabel">4</span>
  <span class="divider"></span>
  <button id="undo"  class="btn" title="撤销 (Ctrl+Z)">↶ 撤销</button>
  <button id="clear" class="btn" title="清空画布">🗑 清空</button>
  <button id="save"  class="btn" title="保存为 PNG">💾 保存</button>
</div>

<script>
(() => {
  'use strict';

  const canvas  = document.getElementById('board');
  const ctx     = canvas.getContext('2d');
  const preview = document.getElementById('preview');
  const pctx    = preview.getContext('2d');

  /* ================= 状态 ================= */
  let dpr         = 1;
  let tool        = 'pen';     // 'pen' | 'eraser'(圈选擦除)
  let color       = '#1f2937';
  let size        = 4;         // CSS 像素
  let drawing     = false;     // 画笔是否正在画
  let lastPoint   = null;
  let activeId    = null;      // 当前指针 id，避免多指乱入
  let lasso       = null;      // { points: [{x,y}, ...] }
  let initialized = false;

  const history     = [];
  const MAX_HISTORY = 40;

  /* ================= 画布尺寸 / 高清适配 ================= */
  function setupCanvas(keepContent = true) {
    // 备份旧内容
    let backup = null;
    if (initialized && keepContent && canvas.width > 0) {
      backup = document.createElement('canvas');
      backup.width  = canvas.width;
      backup.height = canvas.height;
      backup.getContext('2d').drawImage(canvas, 0, 0);
    }

    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = window.innerWidth;
    const h = window.innerHeight;

    // 主画布
    canvas.width  = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap  = 'round';
    ctx.lineJoin = 'round';

    // 预览层
    preview.width  = canvas.width;
    preview.height = canvas.height;
    preview.style.width  = w + 'px';
    preview.style.height = h + 'px';
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 还原内容
    if (backup) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(backup, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    // 尺寸变了，进行中的套索作废
    lasso = null;
    drawing = false;
    lastPoint = null;

    initialized = true;
    applyTool();
  }

  /* ================= 工具状态 ================= */
  function applyTool() {
    // 画笔永远是正常合成
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.fillStyle   = color;
    ctx.lineWidth   = size;
    canvas.style.cursor = 'crosshair';
  }

  function setTool(t) {
    tool = t;
    document.getElementById('pen').classList.toggle('active', t === 'pen');
    document.getElementById('eraser').classList.toggle('active', t === 'eraser');
    // 切工具时丢弃未完成的套索
    lasso = null;
    clearPreview();
    drawing = false;
    lastPoint = null;
    applyTool();
  }

  /* ================= 撤销 ================= */
  function pushHistory() {
    try {
      history.push(canvas.toDataURL('image/png'));
      if (history.length > MAX_HISTORY) history.shift();
    } catch (e) { /* ignore */ }
  }

  function undo() {
    if (!history.length) return;
    const url = history.pop();
    const img = new Image();
    img.onload = () => {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      ctx.restore();
      applyTool();
    };
    img.src = url;
  }

  /* ================= 坐标 ================= */
  function getPoint(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  /* ================= 画笔绘制 ================= */
  function drawDot(p) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(size / 2, 0.5), 0, Math.PI * 2);
    ctx.fill();
  }

  function drawLine(from, to) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.lineWidth = size;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
  }

  /* ================= 圈选擦除 ================= */

  // 在预览层画套索虚线圈
  function drawLassoPreview() {
    clearPreview();
    if (!lasso) return;
    const pts = lasso.points;

    if (pts.length < 2) {
      pctx.beginPath();
      pctx.arc(pts[0].x, pts[0].y, 3, 0, Math.PI * 2);
      pctx.fillStyle = 'rgba(59,130,246,.65)';
      pctx.fill();
      return;
    }

    pctx.save();
    pctx.beginPath();
    pctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) pctx.lineTo(pts[i].x, pts[i].y);
    pctx.closePath();

    // 半透明填充，让用户看清选中范围
    pctx.fillStyle = 'rgba(59,130,246,.12)';
    pctx.fill();

    // 虚线描边
    pctx.setLineDash([6, 5]);
    pctx.lineWidth = 1.5;
    pctx.strokeStyle = 'rgba(59,130,246,.9)';
    pctx.stroke();
    pctx.restore();
  }

  function clearPreview() {
    pctx.save();
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.clearRect(0, 0, preview.width, preview.height);
    pctx.restore();
  }

  // 真正擦除：用 destination-out 把闭合区域内的像素抠掉
  function eraseRegion(pts) {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 只点了一下（点太少）时，擦一个小圆点，给点反馈
  function eraseDot(p) {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(size / 2, 3), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ================= 指针事件 ================= */
  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return; // 仅鼠标左键
    if (activeId !== null) return;                            // 已经有手指在操作
    e.preventDefault();

    activeId = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

    if (tool === 'eraser') {
      // ---- 开始圈选 ----
      lasso = { points: [getPoint(e)] };
      drawLassoPreview();
      return;
    }

    // ---- 画笔 ----
    pushHistory();
    drawing   = true;
    lastPoint = getPoint(e);
    drawDot(lastPoint);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activeId) return;

    if (tool === 'eraser') {
      if (!lasso) return;
      e.preventDefault();
      const evts = (typeof e.getCoalescedEvents === 'function')
        ? e.getCoalescedEvents() : [e];
      for (const ev of evts) lasso.points.push(getPoint(ev));
      drawLassoPreview();
      return;
    }

    if (!drawing) return;
    e.preventDefault();
    const evts = (typeof e.getCoalescedEvents === 'function')
      ? e.getCoalescedEvents() : [e];
    for (const ev of evts) {
      const p = getPoint(ev);
      if (lastPoint) drawLine(lastPoint, p);
      lastPoint = p;
    }
  });

  function endStroke(e) {
    if (e.pointerId !== activeId) return;
    activeId = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}

    // ---- 圈选擦除：松手即擦 ----
    if (tool === 'eraser') {
      if (!lasso) return;
      const pts = lasso.points;
      lasso = null;
      clearPreview();

      if (pts.length >= 3) {
        pushHistory();
        eraseRegion(pts);
      } else if (pts.length === 1) {
        pushHistory();
        eraseDot(pts[0]);
      }
      return;
    }

    // ---- 画笔收笔 ----
    drawing   = false;
    lastPoint = null;
  }

  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  /* ================= 工具栏交互 ================= */
  const $ = (id) => document.getElementById(id);

  $('pen').addEventListener('click',    () => setTool('pen'));
  $('eraser').addEventListener('click', () => setTool('eraser'));

  $('color').addEventListener('input', (e) => {
    color = e.target.value;
    if (tool !== 'pen') setTool('pen');
    applyTool();
  });

  $('size').addEventListener('input', (e) => {
    size = Number(e.target.value);
    $('sizeLabel').textContent = size;
    applyTool();
  });

  $('undo').addEventListener('click', undo);

  $('clear').addEventListener('click', () => {
    pushHistory();
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    applyTool();
  });

  $('save').addEventListener('click', () => {
    // 合成白底再导出，避免透明区域发黑
    const tmp = document.createElement('canvas');
    tmp.width  = canvas.width;
    tmp.height = canvas.height;
    const tctx = tmp.getContext('2d');
    tctx.fillStyle = '#fff';
    tctx.fillRect(0, 0, tmp.width, tmp.height);
    tctx.drawImage(canvas, 0, 0);

    const a = document.createElement('a');
    a.download = 'whiteboard-' + Date.now() + '.png';
    a.href = tmp.toDataURL('image/png');
    a.click();
  });

  /* ================= 快捷键 ================= */
  window.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z') {
      e.preventDefault();
      undo();
    } else if (k === 'e') {
      setTool('eraser');
    } else if (k === 'b') {
      setTool('pen');
    } else if (k === 'escape') {
      lasso = null;
      clearPreview();
    }
  });

  /* ================= 窗口尺寸变化 ================= */
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => setupCanvas(true), 180);
  });

  /* ================= 启动 ================= */
  setupCanvas(false);
})();
</script>
</body>
</html>
