<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练秋湖D组团</title>
    <!-- 轻量二维码库 -->
    <script src="qrcode.min.js"></script>
    <!-- 简洁样式：羊皮纸风格 + 筛选条 + 正则输入框 -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #fcf8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1.5rem;
        }
        .card-grid {
            max-width: 1400px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #5d4a36;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .sub {
            color: #7c6b58;
            font-size: 1.1rem;
            margin-top: 0.2rem;
            border-bottom: 2px solid #e8d9c8;
            padding-bottom: 1rem;
            display: inline-block;
        }

        /* 筛选栏 — 更宽以适应输入框 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.8rem 1.2rem;
            background: #f5ede1;
            padding: 0.9rem 2rem;
            border-radius: 60px;
            margin: 1.5rem auto 2.2rem auto;
            width: fit-content;
            max-width: 100%;
            border: 1px solid #e1d2c0;
            box-shadow: 0 4px 12px rgba(93, 74, 54, 0.08);
        }
        .filter-label {
            font-weight: 500;
            color: #5d4a36;
            font-size: 1rem;
            letter-spacing: 0.3px;
            background: #e8d9c8;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            white-space: nowrap;
        }
        .filter-btn {
            background: transparent;
            border: none;
            padding: 0.4rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 40px;
            color: #5d4a36;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .filter-btn:hover {
            background: #e8d9c8;
            border-color: #d2bca5;
        }
        .filter-btn.active {
            background: #5d4a36;
            color: #fcf8f0;
            box-shadow: 0 4px 8px rgba(93, 74, 54, 0.3);
            border-color: #5d4a36;
        }
        .filter-clear {
            background: #fff3e0;
            border: 1px solid #d2bca5;
            color: #7c5e40;
            margin-left: 0.5rem;
        }
        .filter-clear:hover {
            background: #f5e5d2;
        }

        /* 正则输入框区域 */
        .regex-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #fffbf5;
            padding: 0.2rem 0.5rem 0.2rem 1rem;
            border-radius: 40px;
            border: 1px solid #d2bca5;
            margin-left: 0.5rem;
        }
        .regex-icon {
            color: #7c6b58;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
        }
        #regexInput {
            border: none;
            background: transparent;
            padding: 0.4rem 0.2rem;
            font-size: 0.95rem;
            outline: none;
            color: #5d4a36;
            min-width: 160px;
            font-family: 'Courier New', monospace;
        }
        #regexInput::placeholder {
            color: #b9a792;
            font-style: italic;
            font-family: 'Segoe UI', sans-serif;
        }
        .regex-clear {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #a48e78;
            padding: 0 0.3rem;
            border-radius: 50%;
            line-height: 1;
        }
        .regex-clear:hover {
            color: #5d4a36;
            background: #ede3d6;
        }

        /* 卡片网格 */
        .qr-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1.5rem;
            justify-items: center;
            margin-top: 1rem;
            transition: 0.3s;
        }

        .qr-card {
            background: #fffbf5;
            width: 100%;
            max-width: 220px;
            border-radius: 24px;
            padding: 1.5rem 0.8rem 1.2rem 0.8rem;
            box-shadow: 0 10px 25px -8px rgba(93, 74, 54, 0.15);
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #ede3d6;
        }
        .qr-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 30px -10px rgba(93, 74, 54, 0.25);
            border-color: #dac9b6;
        }
        .qr-canvas-wrap {
            background: #fcf8f0;
            padding: 0.6rem;
            border-radius: 18px;
            box-shadow: inset 0 2px 6px #f0e6d9, 0 6px 10px rgba(93, 74, 54, 0.1);
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        canvas, img {
            width: 140px;
            height: 140px;
            border-radius: 10px;
            display: block;
        }
        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #5d4a36;
            word-break: break-word;
            width: 100%;
            margin-top: 0.3rem;
        }
        .period-badge {
            background: #e8d9c8;
            color: #4a3a2a;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            margin-top: 0.3rem;
            display: inline-block;
            letter-spacing: 0.3px;
            border: 1px solid #dac9b6;
        }

        .footer-note {
            text-align: center;
            margin-top: 3rem;
            color: #7c6b58;
            font-size: 0.9rem;
            border-top: 1px solid #e8d9c8;
            padding-top: 1.8rem;
        }

        .loading-placeholder, .error-message {
            grid-column: 1 / -1;
            padding: 3rem;
            font-size: 1.2rem;
            color: #7c6b58;
            text-align: center;
        }
        .error-message {
            background: #fff0e6;
            color: #b3563b;
            border-radius: 2rem;
            border: 1px solid #ffd9c5;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .qr-container { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 800px) {
            .qr-container { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 500px) {
            .qr-container { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="card-grid">
        <div class="header">
            <h1>练秋湖D组团</h1>
        </div>

        <!-- 筛选按钮 + 正则输入框 (动态生成部分 + 静态输入框) 为了保留结构，filterSection只放时段按钮，输入框单独追加 -->
        <div id="filterSection" class="filter-bar">
            <span class="filter-label">📅 周期</span>
            <!-- 时段按钮通过js生成在此处 -->
        </div>

        <!-- 二维码卡片网格 -->
        <div id="qrGrid" class="qr-container">
            <div class="loading-placeholder">⏳ 载入 CSV 数据中……</div>
        </div>

        <div class="footer-note">
            🌐 by aki 2026/3/3
        </div>
    </div>

    <script>
        (function() {
            const grid = document.getElementById('qrGrid');
            const filterDiv = document.getElementById('filterSection');

            // 存储原始所有卡片数据
            let masterData = [];

            // 当前选中的period (null表示全部)
            let currentPeriod = null;
            // 当前正则表达式字符串 (空串表示无过滤)
            let currentRegex = '';

            // 用于防抖的timer
            let debounceTimer = null;

            // ---------- 渲染卡片 (接受过滤后的数据) ----------
            function renderQRCards(items) {
                grid.innerHTML = '';  // 清空

                if (!items || items.length === 0) {
                    grid.innerHTML = `<div class="error-message" style="background: #f5ede1; color: #7c6b58;">📭 没有符合该时段 + 正则条件的会议室</div>`;
                    return;
                }

                items.forEach(item => {
                    const room = item.room || '未命名会议室';
                    const code = item.code || '';
                    const period = item.period || '未分类';

                    const card = document.createElement('div');
                    card.className = 'qr-card';

                    const qrWrapper = document.createElement('div');
                    qrWrapper.className = 'qr-canvas-wrap';

                    if (!code) {
                        qrWrapper.innerHTML = `<span style="font-size:2rem; color:#b3563b;">⚠️</span>`;
                    } else {
                        try {
                            const qr = qrcode(0, 'M');
                            qr.addData(code);
                            qr.make();

                            const canvas = document.createElement('canvas');
                            const cellSize = 4;
                            const size = qr.getModuleCount();
                            canvas.width = size * cellSize;
                            canvas.height = size * cellSize;

                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#fcf8f0';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);

                            ctx.fillStyle = '#5d4a36';
                            for (let row = 0; row < size; row++) {
                                for (let col = 0; col < size; col++) {
                                    if (qr.isDark(row, col)) {
                                        ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                                    }
                                }
                            }
                            qrWrapper.appendChild(canvas);
                        } catch (e) {
                            console.warn('二维码生成失败', e);
                            qrWrapper.innerHTML = `<span style="color:#b3563b;">❌</span>`;
                        }
                    }

                    card.appendChild(qrWrapper);

                    const titleEl = document.createElement('div');
                    titleEl.className = 'card-title';
                    titleEl.textContent = room;

                    const periodEl = document.createElement('div');
                    periodEl.className = 'period-badge';
                    periodEl.textContent = period;

                    card.appendChild(titleEl);
                    card.appendChild(periodEl);
                    grid.appendChild(card);
                });
            }

            // ---------- 综合过滤 (period + 正则) ----------
            function getFilteredData() {
                if (!masterData.length) return [];

                let filtered = masterData;

                // 时段过滤
                if (currentPeriod !== null) {
                    filtered = filtered.filter(item => item.period === currentPeriod);
                }

                // 正则过滤 (如果输入非空)
                if (currentRegex.trim() !== '') {
                    try {
                        const regex = new RegExp(currentRegex, 'i'); // 忽略大小写
                        filtered = filtered.filter(item => regex.test(item.room));
                    } catch (e) {
                        // 正则无效：暂时不过滤，但可以提示（但为了体验，我们返回原过滤但可以在控制台警告）
                        console.warn('无效的正则表达式:', currentRegex, e);
                        // 也可以选择显示错误，但为了不中断UI，这里返回未应用正则的过滤（或返回空？选择返回未应用）
                        // 为了友好，依然返回 filtered (时段过滤后的数据) 但给用户一个视觉提示？可以通过输入框边框变色，此处略。
                        // 为了清晰，我们在输入框标题简单提示，但保持数据不变。
                    }
                }

                return filtered;
            }

            // 更新视图 (从masterData计算过滤后数据并渲染)
            function updateGrid() {
                if (!masterData.length) {
                    grid.innerHTML = `<div class="loading-placeholder">⏳ 暂无数据</div>`;
                    return;
                }

                const filtered = getFilteredData();
                renderQRCards(filtered);
            }

            // 防抖更新 (用于输入框)
            function debouncedUpdate() {
                if (debounceTimer) clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    updateGrid();
                }, 300);
            }

            // ---------- 生成筛选按钮 (从masterData提取唯一period) ----------
            function buildFilterButtons() {
                const periodSet = new Set();
                masterData.forEach(item => periodSet.add(String(item.period)));
                let periods = Array.from(periodSet).sort((a,b) => a.localeCompare(b));

                // 清空filterDiv，保留左侧的filter-label (第一个span)
                filterDiv.innerHTML = '<span class="filter-label">📅 周期</span>';

                // 全部按钮
                const allBtn = document.createElement('button');
                allBtn.className = `filter-btn ${currentPeriod === null ? 'active' : ''}`;
                allBtn.textContent = '全部';
                allBtn.dataset.period = 'null';
                allBtn.addEventListener('click', () => {
                    currentPeriod = null;
                    updateActiveClass();
                    updateGrid();
                });
                filterDiv.appendChild(allBtn);

                // 每个period按钮
                periods.forEach(p => {
                    const btn = document.createElement('button');
                    btn.className = `filter-btn ${currentPeriod === p ? 'active' : ''}`;
                    btn.textContent = p;
                    btn.dataset.period = p;
                    btn.addEventListener('click', () => {
                        currentPeriod = p;
                        updateActiveClass();
                        updateGrid();
                    });
                    filterDiv.appendChild(btn);
                });

                // 重置按钮 (重置period和正则)
                const resetBtn = document.createElement('button');
                resetBtn.className = 'filter-btn filter-clear';
                resetBtn.textContent = '↺ 重置';
                resetBtn.addEventListener('click', () => {
                    currentPeriod = null;
                    currentRegex = '';
                    // 清空输入框的值
                    const regexInput = document.getElementById('regexInput');
                    if (regexInput) regexInput.value = '';
                    updateActiveClass();
                    updateGrid();
                });
                filterDiv.appendChild(resetBtn);

                // ---------- 在filterDiv末尾添加正则输入框 (单独包装) ----------
                const regexWrapper = document.createElement('div');
                regexWrapper.className = 'regex-wrapper';
                regexWrapper.innerHTML = `
                    <span class="regex-icon">🔍 regex</span>
                    <input type="text" id="regexInput" placeholder="房间名正则 (如 101|202)" value="">
                    <button class="regex-clear" id="regexClearBtn" title="清除正则">✕</button>
                `;
                filterDiv.appendChild(regexWrapper);

                // 绑定输入事件
                const inputEl = document.getElementById('regexInput');
                const clearBtn = document.getElementById('regexClearBtn');

                inputEl.addEventListener('input', (e) => {
                    currentRegex = e.target.value;
                    // 输入时更新period激活样式？但period保持原样。只需要更新网格
                    // 但需要保持按钮active样式不变
                    debouncedUpdate();
                });

                clearBtn.addEventListener('click', () => {
                    inputEl.value = '';
                    currentRegex = '';
                    updateGrid(); // 立即更新，无需防抖
                    inputEl.focus();
                });

                // 更新按钮激活状态
                function updateActiveClass() {
                    Array.from(filterDiv.querySelectorAll('.filter-btn')).forEach(btn => {
                        if (btn.dataset.period === 'null' && currentPeriod === null) {
                            btn.classList.add('active');
                        } else if (btn.dataset.period !== 'null' && btn.dataset.period === currentPeriod) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                }
            }

            // ---------- 解析CSV (复用之前的代码) ----------
            function parseCSV(csvText) {
                const lines = [];
                const rawLines = csvText.split(/\r?\n/);
                for (let line of rawLines) {
                    if (line.trim() === '') continue;
                    lines.push(line);
                }

                if (lines.length < 2) {
                    throw new Error('CSV至少需要一行标题+一行数据');
                }

                function parseCSVLine(line) {
                    const result = [];
                    let current = '';
                    let inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const ch = line[i];
                        if (ch === '"') {
                            if (inQuotes && line[i+1] === '"') {
                                current += '"';
                                i++;
                            } else {
                                inQuotes = !inQuotes;
                            }
                        } else if (ch === ',' && !inQuotes) {
                            result.push(current);
                            current = '';
                        } else {
                            current += ch;
                        }
                    }
                    result.push(current);
                    return result;
                }

                const header = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
                let roomIdx = header.findIndex(h => h === 'room' || h === '会议室' || h === '名称');
                let codeIdx = header.findIndex(h => h === 'code' || h === '二维码' || h === 'qr' || h === '内容');
                let periodIdx = header.findIndex(h => h === 'period' || h === '时段' || h === '时间段');

                if (roomIdx === -1 && codeIdx === -1 && periodIdx === -1 && header.length >= 3) {
                    console.warn('未找到标准列名，尝试按顺序映射 (第1列->room, 第2列->code, 第3列->period)');
                    roomIdx = 0;
                    codeIdx = 1;
                    periodIdx = 2;
                }

                if (roomIdx === -1 || codeIdx === -1 || periodIdx === -1) {
                    throw new Error('CSV缺少必要的列(room, code, period)');
                }

                const dataRows = [];
                for (let i = 1; i < lines.length; i++) {
                    const values = parseCSVLine(lines[i]);
                    while (values.length < header.length) values.push('');
                    const roomVal = values[roomIdx] ? values[roomIdx].trim() : `会议室-${i}`;
                    const codeVal = values[codeIdx] ? values[codeIdx].trim() : '';
                    const periodVal = values[periodIdx] ? values[periodIdx].trim() : '未指定';

                    dataRows.push({
                        room: roomVal,
                        code: codeVal,
                        period: periodVal || '未指定'
                    });
                }
                return dataRows;
            }

            // ---------- 加载CSV数据 ----------
            function loadCSVData() {
                const csvPath = 'data';

                fetch(csvPath, { method: 'GET', headers: { 'Accept': 'text/csv' } })
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status} — 无法加载 ${csvPath}`);
                    return response.text();
                })
                .then(csvText => {
                    let parsedData;
                    try {
                        parsedData = parseCSV(csvText);
                    } catch (parseErr) {
                        grid.innerHTML = `<div class="error-message">❌ CSV 解析失败: ${parseErr.message}</div>`;
                        return;
                    }

                    if (!parsedData || parsedData.length === 0) {
                        grid.innerHTML = `<div class="error-message">📂 CSV 解析后无数据行，请检查文件内容。</div>`;
                        return;
                    }

                    masterData = parsedData;
                    buildFilterButtons();   // 这会同时添加正则输入框
                    updateGrid();            // 初始显示全部
                })
                .catch(error => {
                    console.error(error);
                    grid.innerHTML = `<div class="error-message">🚫 读取 ${csvPath} 失败。<br>请确认文件存在且格式正确。详情：${error.message}</div>`;
                });
            }

            loadCSVData();
        })();
    </script>
</body>
</html>
