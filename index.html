<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练秋湖D组团</title>
    <link rel="icon" href="data:,">
    <script src="qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #fcf8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem;
        }
        .card-grid { max-width: 1400px; width: 100%; }

        .header { text-align: center; margin-bottom: 1rem; }
        .header h1 {
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            font-weight: 600;
            color: #5d4a36;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: #f5ede1;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            margin: 1rem auto 1.5rem;
            max-width: 100%;
            border: 1px solid #e1d2c0;
        }
        .filter-label {
            font-weight: 500; color: #5d4a36; font-size: 0.9rem;
            background: #e8d9c8; padding: 0.25rem 0.8rem; border-radius: 30px;
            white-space: nowrap;
        }
        .period-select-wrapper {
            display: flex; align-items: center; gap: 0.2rem;
            background: #fffbf5; padding: 0.1rem 0.3rem 0.1rem 0.6rem;
            border-radius: 30px; border: 1px solid #d2bca5;
            min-width: 0;
        }
        .period-select {
            background: transparent; border: none;
            padding: 0.35rem 1.4rem 0.35rem 0.3rem;
            font-size: 0.85rem; color: #5d4a36; outline: none;
            border-radius: 30px; cursor: pointer; font-weight: 500;
            appearance: none;
            background-image: none;
            max-width: 8rem;
            text-overflow: ellipsis;
        }
        .reset-btn {
            background: #fff3e0; border: 1px solid #d2bca5;
            color: #7c5e40; border-radius: 30px;
            padding: 0.35rem 0.8rem; font-size: 0.85rem;
            font-weight: 500; cursor: pointer; white-space: nowrap;
            transition: 0.15s;
        }
        .reset-btn:hover { background: #f5e5d2; }

        .regex-wrapper {
            display: flex; align-items: center; gap: 0.3rem;
            background: #fffbf5; padding: 0.1rem 0.3rem 0.1rem 0.6rem;
            border-radius: 30px; border: 1px solid #d2bca5;
            flex: 1 1 auto;
            min-width: 100px;
            max-width: 260px;
        }
        .regex-icon { color: #7c6b58; font-size: 0.8rem; white-space: nowrap; }
        #regexInput {
            border: none; background: transparent;
            padding: 0.35rem 0.1rem; font-size: 0.85rem;
            outline: none; color: #5d4a36;
            min-width: 60px; width: 100%;
            font-family: 'Courier New', monospace;
        }
        #regexInput::placeholder { color: #b9a792; font-style: italic; font-family: inherit; }
        .regex-clear {
            background: none; border: none; font-size: 1rem;
            cursor: pointer; color: #a48e78;
            padding: 0 0.2rem; border-radius: 50%; line-height: 1;
        }
        .regex-clear:hover { color: #5d4a36; background: #ede3d6; }

        .count-badge {
            background: #5d4a36; color: #fcf8f0;
            font-size: 0.75rem; font-weight: 600;
            padding: 0.15rem 0.8rem; border-radius: 30px;
            white-space: nowrap; border: 1px solid #ac9a86;
        }

        .qr-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1.2rem;
            justify-items: center;
            margin-top: 0.5rem;
        }
        .qr-card {
            background: #fffbf5; width: 100%;
            max-width: 220px; border-radius: 20px;
            padding: 1rem 0.6rem 0.8rem;
            box-shadow: 0 8px 20px -8px rgba(93,74,54,0.12);
            display: flex; flex-direction: column;
            align-items: center; text-align: center;
            border: 1px solid #ede3d6;
        }
        @media (hover: hover) {
            .qr-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 14px 28px -10px rgba(93,74,54,0.2);
                border-color: #dac9b6;
            }
        }
        .qr-canvas-wrap {
            background: #fcf8f0; padding: 0.4rem;
            border-radius: 14px;
            box-shadow: inset 0 2px 4px #f0e6d9, 0 4px 8px rgba(93,74,54,0.08);
            margin-bottom: 0.5rem;
            display: flex; justify-content: center; align-items: center;
            width: 100%;
        }
        canvas, img {
            max-width: 100%; height: auto;
            border-radius: 8px; display: block;
        }
        .card-title {
            font-weight: 600; font-size: clamp(0.8rem, 2vw, 1.1rem);
            color: #5d4a36; word-break: break-word; width: 100%;
            margin-top: 0.2rem;
        }
        .period-badge {
            background: #e8d9c8; color: #4a3a2a;
            font-size: 0.65rem; font-weight: 500;
            padding: 0.15rem 0.8rem; border-radius: 30px;
            margin-top: 0.25rem; display: inline-block;
            border: 1px solid #dac9b6;
        }

        .footer-note {
            text-align: center; margin-top: 2.5rem;
            color: #7c6b58; font-size: 0.85rem;
            border-top: 1px solid #e8d9c8; padding-top: 1.5rem;
        }

        .loading-placeholder, .error-message {
            grid-column: 1 / -1; padding: 2rem 1rem;
            font-size: 1rem; color: #7c6b58; text-align: center;
        }
        .error-message {
            background: #fff0e6; color: #b3563b;
            border-radius: 1.5rem; border: 1px solid #ffd9c5;
        }

        @media (max-width: 1200px) { .qr-container { grid-template-columns: repeat(4, 1fr); gap: 1rem; } }
        @media (max-width: 900px)  { .qr-container { grid-template-columns: repeat(3, 1fr); gap: 0.8rem; } }
        @media (max-width: 600px)  { .qr-container { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; } }
        @media (max-width: 380px)  { .qr-container { grid-template-columns: 1fr; gap: 0.6rem; } }

        @media (max-width: 600px) {
            body { padding: 0.6rem; }
            .filter-bar { padding: 0.5rem 0.8rem; gap: 0.4rem; border-radius: 30px; }
            .filter-label { font-size: 0.8rem; padding: 0.2rem 0.6rem; }
            .reset-btn { font-size: 0.8rem; padding: 0.3rem 0.6rem; }
            .period-select { font-size: 0.8rem; max-width: 6rem; padding-right: 1.2rem; }
            .regex-wrapper { min-width: 80px; max-width: 180px; }
            #regexInput { font-size: 0.8rem; }
            .qr-card { padding: 0.7rem 0.4rem 0.6rem; border-radius: 16px; }
            .qr-canvas-wrap { padding: 0.3rem; }
        }
        @media (max-width: 380px) {
            .filter-bar { flex-direction: column; align-items: stretch; width: 100%; }
            .period-select-wrapper { justify-content: center; }
            .regex-wrapper { max-width: 100%; }
            .count-badge { text-align: center; }
        }
    </style>
</head>
<body>
    <div class="card-grid">
        <div class="header">
            <h1>练秋湖D组团 · update 2026.3.3</h1>
        </div>

        <!-- 筛选栏 -->
        <div id="filterBar" class="filter-bar">
            <span class="filter-label">📅 周期</span>
            <!-- 其余控件由js动态插入 -->
        </div>

        <!-- 二维码卡片网格 -->
        <div id="qrGrid" class="qr-container">
            <div class="loading-placeholder">⏳ 载入数据中……</div>
        </div>

        <div class="footer-note">
            🌐 by aki
        </div>
    </div>

    <script>
        (function() {
            const grid = document.getElementById('qrGrid');
            const filterBar = document.getElementById('filterBar');

            // 原始数据 (每行包含room, code, period, 以及可选的id)
            let masterData = [];

            // 当前选中的周期 (null = 全部)
            let currentPeriod = null;
            // 当前正则字符串
            let currentRegex = '';

            // 防抖timer
            let debounceTimer = null;

            // DOM元素引用
            let periodSelect = null;
            let regexInput = null;
            let countSpan = null;

            // ---------- 渲染卡片 ----------
            function renderQRCards(items) {
                grid.innerHTML = '';

                if (!items || items.length === 0) {
                    grid.innerHTML = `<div class="error-message" style="background: #f5ede1; color: #7c6b58;">📭 没有找到相关的数据</div>`;
                    return;
                }

                items.forEach(item => {
                    const room = item.room || '未命名会议室';
                    const code = item.code || '';
                    const period = item.period || '未分类';

                    const card = document.createElement('div');
                    card.className = 'qr-card';

                    const qrWrapper = document.createElement('div');
                    qrWrapper.className = 'qr-canvas-wrap';

                    if (!code) {
                        qrWrapper.innerHTML = `<span style="font-size:2rem; color:#b3563b;">⚠️</span>`;
                    } else {
                        try {
                            const qr = qrcode(0, 'M');
                            qr.addData(code);
                            qr.make();

                            const canvas = document.createElement('canvas');
                            const cellSize = 4;
                            const size = qr.getModuleCount();
                            canvas.width = size * cellSize;
                            canvas.height = size * cellSize;

                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#fcf8f0';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);

                            ctx.fillStyle = '#5d4a36';
                            for (let row = 0; row < size; row++) {
                                for (let col = 0; col < size; col++) {
                                    if (qr.isDark(row, col)) {
                                        ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                                    }
                                }
                            }
                            qrWrapper.appendChild(canvas);
                        } catch (e) {
                            console.warn('二维码生成失败', e);
                            qrWrapper.innerHTML = `<span style="color:#b3563b;">❌</span>`;
                        }
                    }

                    card.appendChild(qrWrapper);

                    const titleEl = document.createElement('div');
                    titleEl.className = 'card-title';
                    titleEl.textContent = room;

                    const periodEl = document.createElement('div');
                    periodEl.className = 'period-badge';
                    periodEl.textContent = period;

                    card.appendChild(titleEl);
                    card.appendChild(periodEl);
                    grid.appendChild(card);
                });
            }

            // ---------- 过滤逻辑 ----------
            function getFilteredData() {
                if (!masterData.length) return [];

                let filtered = masterData;

                // 周期过滤
                if (currentPeriod !== null) {
                    filtered = filtered.filter(item => item.period === currentPeriod);
                }

                // 正则过滤
                if (currentRegex.trim() !== '') {
                    try {
                        const regex = new RegExp(currentRegex, 'i');
                        filtered = filtered.filter(item => regex.test(item.room));
                    } catch (e) {
                        console.warn('无效的正则表达式:', currentRegex, e);
                    }
                }
                return filtered;
            }

            // 更新网格 + 更新计数标签
            function updateGridAndCount() {
                if (!masterData.length) {
                    grid.innerHTML = `<div class="loading-placeholder">⏳ 暂无数据</div>`;
                    if (countSpan) countSpan.textContent = '0';
                    return;
                }
                const filtered = getFilteredData();
                renderQRCards(filtered);
                if (countSpan) {
                    countSpan.textContent = filtered.length;
                }
            }

            // 防抖包装
            function debouncedUpdate() {
                if (debounceTimer) clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    updateGridAndCount();
                }, 300);
            }

            // ---------- 构建筛选条 ----------
            function buildFilterControls() {
                filterBar.innerHTML = '<span class="filter-label">📅 周期</span>';

                // 1. 下拉容器
                const selectWrapper = document.createElement('div');
                selectWrapper.className = 'period-select-wrapper';
                const selectEl = document.createElement('select');
                selectEl.className = 'period-select';
                selectEl.id = 'periodSelect';
                selectWrapper.appendChild(selectEl);
                filterBar.appendChild(selectWrapper);

                // 2. 重置按钮
                const resetBtn = document.createElement('button');
                resetBtn.className = 'reset-btn';
                resetBtn.textContent = '↺ 重置筛选';
                filterBar.appendChild(resetBtn);

                // 3. 正则包装
                const regexWrapper = document.createElement('div');
                regexWrapper.className = 'regex-wrapper';
                regexWrapper.innerHTML = `
                    <span class="regex-icon">🔍 regex</span>
                    <input type="text" id="regexInput" placeholder="房间名正则 (如 101|202)" value="">
                    <button class="regex-clear" id="regexClearBtn" title="清除正则">✕</button>
                `;
                filterBar.appendChild(regexWrapper);

                // 4. 计数标签
                const countBadge = document.createElement('span');
                countBadge.className = 'count-badge';
                countBadge.id = 'roomCountBadge';
                countBadge.textContent = '0';
                filterBar.appendChild(countBadge);

                // 获取引用
                periodSelect = document.getElementById('periodSelect');
                regexInput = document.getElementById('regexInput');
                const regexClear = document.getElementById('regexClearBtn');
                countSpan = document.getElementById('roomCountBadge');

                // --- 填充下拉选项 (严格按照原始数据中ID列出现的顺序) ---
                function populateSelect() {
                    if (!masterData.length) return;

                    // 我们需要获取每个周期第一次出现时的顺序
                    // 方法：遍历masterData，记录每个period第一次出现的索引
                    const periodFirstIndex = new Map();
                    masterData.forEach((item, index) => {
                        const period = String(item.period);
                        if (!periodFirstIndex.has(period)) {
                            periodFirstIndex.set(period, index);
                        }
                    });

                    // 将周期按照第一次出现的索引排序
                    const sortedPeriods = Array.from(periodFirstIndex.entries())
                        .sort((a, b) => a[1] - b[1])  // 按首次出现索引排序
                        .map(entry => entry[0]);      // 只保留周期值

                    periodSelect.innerHTML = ''; // 清空

                    // 全部选项
                    const allOption = document.createElement('option');
                    allOption.value = '';
                    allOption.textContent = '全部周期';
                    periodSelect.appendChild(allOption);

                    // 按首次出现顺序添加周期
                    sortedPeriods.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p;
                        opt.textContent = p;
                        periodSelect.appendChild(opt);
                    });

                    // 恢复选中状态
                    if (currentPeriod !== null && sortedPeriods.includes(currentPeriod)) {
                        periodSelect.value = currentPeriod;
                    } else {
                        periodSelect.value = '';
                        currentPeriod = null;
                    }
                }

                if (masterData.length) populateSelect();

                // --- 监听下拉改变 ---
                periodSelect.addEventListener('change', (e) => {
                    const val = e.target.value;
                    currentPeriod = val === '' ? null : val;
                    updateGridAndCount();
                });

                // --- 正则输入 ---
                regexInput.addEventListener('input', (e) => {
                    currentRegex = e.target.value;
                    debouncedUpdate();
                });

                // 清除正则
                regexClear.addEventListener('click', () => {
                    regexInput.value = '';
                    currentRegex = '';
                    updateGridAndCount();
                    regexInput.focus();
                });

                // 重置按钮
                resetBtn.addEventListener('click', () => {
                    periodSelect.value = '';
                    currentPeriod = null;
                    regexInput.value = '';
                    currentRegex = '';
                    updateGridAndCount();
                });

                // 暴露刷新方法
                window._refreshPeriodSelect = populateSelect;
            }

            // ---------- CSV解析 (增加对ID列的识别) ----------
            function parseCSV(csvText) {
                const lines = [];
                const rawLines = csvText.split(/\r?\n/);
                for (let line of rawLines) {
                    if (line.trim() === '') continue;
                    lines.push(line);
                }

                if (lines.length < 2) {
                    throw new Error('CSV至少需要一行标题+一行数据');
                }

                function parseCSVLine(line) {
                    const result = [];
                    let current = '';
                    let inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const ch = line[i];
                        if (ch === '"') {
                            if (inQuotes && line[i+1] === '"') {
                                current += '"';
                                i++;
                            } else {
                                inQuotes = !inQuotes;
                            }
                        } else if (ch === ',' && !inQuotes) {
                            result.push(current);
                            current = '';
                        } else {
                            current += ch;
                        }
                    }
                    result.push(current);
                    return result;
                }

                const header = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
                
                // 查找必需的列
                let roomIdx = header.findIndex(h => h === 'room' || h === '会议室' || h === '名称');
                let codeIdx = header.findIndex(h => h === 'code' || h === '二维码' || h === 'qr' || h === '内容');
                let periodIdx = header.findIndex(h => h === 'period' || h === '时段' || h === '时间段');
                
                if (roomIdx === -1 && codeIdx === -1 && periodIdx === -1 && header.length >= 3) {
                    console.warn('未找到标准列名，尝试按顺序映射 (第1列->room, 第2列->code, 第3列->period)');
                    roomIdx = 0;
                    codeIdx = 1;
                    periodIdx = 2;
                }

                if (roomIdx === -1 || codeIdx === -1 || periodIdx === -1) {
                    throw new Error('CSV缺少必要的列(room, code, period)');
                }

                const dataRows = [];
                for (let i = 1; i < lines.length; i++) {
                    const values = parseCSVLine(lines[i]);
                    while (values.length < header.length) values.push('');
                    
                    const roomVal = values[roomIdx] ? values[roomIdx].trim() : `会议室-${i}`;
                    const codeVal = values[codeIdx] ? values[codeIdx].trim() : '';
                    const periodVal = values[periodIdx] ? values[periodIdx].trim() : '未指定';
                    
                    dataRows.push({
                        room: roomVal,
                        code: codeVal,
                        period: periodVal || '未指定'
                    });
                }
                return dataRows;
            }

            // ---------- 加载CSV ----------
            function loadCSVData() {
                const csvPath = 'data';

                fetch(csvPath, { method: 'GET', headers: { 'Accept': 'text/csv' } })
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status} — 无法加载 ${csvPath}`);
                    return response.text();
                })
                .then(csvText => {
                    let parsedData;
                    try {
                        parsedData = parseCSV(csvText);
                    } catch (parseErr) {
                        grid.innerHTML = `<div class="error-message">❌ CSV 解析失败: ${parseErr.message}</div>`;
                        return;
                    }

                    if (!parsedData || parsedData.length === 0) {
                        grid.innerHTML = `<div class="error-message">📂 CSV 解析后无数据行，请检查文件内容。</div>`;
                        return;
                    }

                    masterData = parsedData;

                    // 构建控件 (内部会根据masterData填充下拉，并按照数据原始顺序排序)
                    buildFilterControls();

                    if (window._refreshPeriodSelect) window._refreshPeriodSelect();

                    // 初始更新
                    updateGridAndCount();
                })
                .catch(error => {
                    console.error(error);
                    grid.innerHTML = `<div class="error-message">🚫 读取 ${csvPath} 失败。<br>请确认文件存在且格式正确。详情：${error.message}</div>`;
                    if (countSpan) countSpan.textContent = '0';
                });
            }

            loadCSVData();
        })();
    </script>
</body>
</html>
