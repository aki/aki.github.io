
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code · JSON Showcase</title>
    <!-- 使用轻量的 QR 库 qrcode-generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <!-- 简单样式，干净卡片布局 -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .card-grid {
            max-width: 1200px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #1f2b3a;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header h1 span {
            background: #1f2b3a;
            color: white;
            font-size: 0.9rem;
            font-weight: 400;
            padding: 0.2rem 1rem;
            border-radius: 30px;
        }
        .sub {
            color: #4a5b6e;
            font-size: 1.1rem;
            margin-top: 0.5rem;
            border-bottom: 2px solid #dde3ed;
            padding-bottom: 1rem;
            display: inline-block;
        }
        /* json 数据源标记 */
        .json-badge {
            background: #e8ecf3;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: #1f2b3a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            margin-bottom: 1.8rem;
        }
        .json-badge code {
            background: #1f2b3a;
            color: #d4e0f0;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        /* 卡片区 */
        .qr-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.8rem;
            justify-items: center;
            margin-top: 1rem;
        }
        .qr-card {
            background: white;
            width: 100%;
            max-width: 280px;
            border-radius: 28px;
            padding: 1.8rem 1rem 1.4rem 1rem;
            box-shadow: 0 15px 30px -10px rgba(0,20,40,0.15);
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #ffffff50;
            backdrop-filter: blur(2px);
        }
        .qr-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 35px -12px rgba(18, 52, 77, 0.2);
            border-color: #b3ceff;
        }
        .qr-canvas-wrap {
            background: white;
            padding: 0.8rem;
            border-radius: 20px;
            box-shadow: inset 0 2px 8px #ebf0f8, 0 8px 14px rgba(0,30,60,0.1);
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        canvas, img {
            width: 160px;
            height: 160px;
            border-radius: 12px;
            display: block;
        }
        .card-title {
            font-weight: 600;
            font-size: 1.25rem;
            color: #152b42;
            word-break: break-word;
            width: 100%;
            margin-bottom: 0.4rem;
        }
        .card-desc {
            color: #3f5569;
            font-size: 0.9rem;
            background: #f0f5fd;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin: 0.5rem 0 0.2rem;
            border: 1px solid #dae4f0;
        }
        .card-url {
            color: #2563eb;
            font-size: 0.75rem;
            background: #eef4ff;
            width: 100%;
            padding: 0.4rem;
            border-radius: 30px;
            word-break: break-all;
            text-decoration: none;
            border: 1px dashed #a2c0f0;
            margin-top: 0.5rem;
        }
        .card-url:hover {
            background: #dbebff;
        }
        .footer-note {
            text-align: center;
            margin-top: 3rem;
            color: #4f658d;
            font-size: 0.9rem;
            border-top: 1px solid #d9e2ef;
            padding-top: 1.8rem;
        }
        .footer-note a {
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 500;
        }
        .loading-placeholder {
            grid-column: 1 / -1;
            padding: 3rem;
            font-size: 1.2rem;
            color: #4b6589;
        }
        .error-message {
            background: #ffe6e6;
            color: #a12;
            padding: 2rem;
            border-radius: 2rem;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="card-grid">
        <div class="header">
            <h1>
                📦 QR · JSON showcase
                <span>github.io</span>
            </h1>
            <div class="json-badge">
                <span>📄 数据源</span>
                <code>/qr-data.json</code>
                <span>↻ 动态渲染</span>
            </div>
            <div class="sub">
                ✦ 从外部 JSON 生成二维码 ✦
            </div>
        </div>

        <!-- 二维码卡片将动态插入这里 -->
        <div id="qrGrid" class="qr-container">
            <div class="loading-placeholder">⏳ 载入 JSON 数据中……</div>
        </div>

        <div class="footer-note">
            🌐 使用 <strong>qrcode-generator</strong> · 
            搭配 <code style="background:#eef2f7;">qr-data.json</code> 动态渲染 · 
            适配 GitHub Pages
        </div>
    </div>

    <script>
        (function() {
            // 待会要填充的网格容器
            const grid = document.getElementById('qrGrid');

            // 初始化所有二维码的函数 (接收解析后的数组)
            function renderQRCards(items) {
                // 清空 loading 或旧内容
                grid.innerHTML = '';

                // 防御性检查：必须是非空数组
                if (!Array.isArray(items) || items.length === 0) {
                    grid.innerHTML = `<div class="error-message">❌ JSON 数据格式不符：应为包含对象的数组，或数组为空。</div>`;
                    return;
                }

                // 遍历数组，为每一项生成卡片
                items.forEach((item, index) => {
                    // 提取字段 (支持自定义容错)
                    const label = item.label || item.title || `条目 #${index+1}`;
                    // 优先使用 url 字段，若没有则尝试 link、href，最后使用 text 或空字符串
                    const content = item.url || item.link || item.href || item.text || '';
                    // 备用描述 (可选)
                    const description = item.desc || item.description || item.note || '';

                    // 如果内容为空，可以显示占位信息，但避免生成空二维码
                    if (!content) {
                        // 生成一个带警告的卡片，说明无有效链接
                        const card = document.createElement('div');
                        card.className = 'qr-card';
                        card.innerHTML = `
                            <div class="qr-canvas-wrap" style="background:#f0f2f5; padding:1.6rem;">
                                <span style="font-size:3rem;">⚠️</span>
                            </div>
                            <div class="card-title">${escapeHtml(label)}</div>
                            <div class="card-desc">${escapeHtml(description) || '无有效链接'}</div>
                            <div class="card-url" style="color:#b00;">(空数据)</div>
                        `;
                        grid.appendChild(card);
                        return;
                    }

                    // 创建卡片外层
                    const card = document.createElement('div');
                    card.className = 'qr-card';

                    // 用于放置二维码的容器
                    const qrWrapper = document.createElement('div');
                    qrWrapper.className = 'qr-canvas-wrap';
                    
                    // 生成二维码
                    try {
                        // 使用 qrcode-generator 库 (全局变量 qrcode)
                        const qr = qrcode(0, 'M');  // 类型0 (自动选择) , 纠错级别 M
                        qr.addData(content);
                        qr.make();

                        // 创建 canvas 元素 (也可以生成 table, 但 canvas 更清晰)
                        const canvas = document.createElement('canvas');
                        // 获取矩阵大小
                        const cellSize = 4;      // 每个点放大倍数
                        const size = qr.getModuleCount();
                        canvas.width = size * cellSize;
                        canvas.height = size * cellSize;

                        const ctx = canvas.getContext('2d');
                        // 绘制白色背景
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        // 绘制深色模块
                        ctx.fillStyle = '#0a1a2b';   // 深色风格
                        for (let row = 0; row < size; row++) {
                            for (let col = 0; col < size; col++) {
                                if (qr.isDark(row, col)) {
                                    ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                                }
                            }
                        }

                        qrWrapper.appendChild(canvas);
                    } catch (e) {
                        console.warn('二维码生成失败', e);
                        qrWrapper.innerHTML = `<span style="color:#b00; padding:1rem;">QR error</span>`;
                    }

                    // 创建标题、描述、链接
                    const titleEl = document.createElement('div');
                    titleEl.className = 'card-title';
                    titleEl.textContent = label.length > 30 ? label.slice(0,30)+'…' : label;

                    const descEl = document.createElement('div');
                    descEl.className = 'card-desc';
                    descEl.textContent = description.length > 40 ? description.slice(0,40)+'…' : (description || ' ');

                    const linkEl = document.createElement('a');
                    linkEl.className = 'card-url';
                    linkEl.href = content;
                    linkEl.target = '_blank';    // 安全打开
                    linkEl.rel = 'noopener noreferrer';
                    linkEl.textContent = content.length > 50 ? content.slice(0,45)+'…' : content;

                    // 组装卡片
                    card.appendChild(qrWrapper);
                    card.appendChild(titleEl);
                    card.appendChild(descEl);
                    card.appendChild(linkEl);
                    grid.appendChild(card);
                });
            }

            // 简单的防XSS转义 (针对用户输入，上面textContent已经安全，但用在innerHTML时需要)
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // 从相对路径获取 JSON (适合 github.io)
            function loadJSONData() {
                const jsonPath = 'qr-data.json';  // 同一目录下的 json 文件
                fetch(jsonPath, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} — 无法加载 ${jsonPath}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // 支持两种常见结构：直接是数组，或者嵌套在根字段如 "items", "qrlist" 里
                    let itemsArray = null;
                    if (Array.isArray(data)) {
                        itemsArray = data;
                    } else if (data && Array.isArray(data.items)) {
                        itemsArray = data.items;
                    } else if (data && Array.isArray(data.qrList)) {
                        itemsArray = data.qrList;
                    } else if (data && Array.isArray.data.entries) {
                        itemsArray = data.entries;
                    } else {
                        // 尝试取出第一个值是数组的字段
                        for (let key in data) {
                            if (Array.isArray(data[key])) {
                                itemsArray = data[key];
                                break;
                            }
                        }
                    }

                    if (!itemsArray) {
                        // 如果依然没找到数组，则降级：将整个对象包装成数组？
                        // 但那样可能不符合预期，提示格式错误。
                        grid.innerHTML = `<div class="error-message">❌ JSON 根级应为数组，或包含 items/qrList 数组字段。</div>`;
                        return;
                    }
                    renderQRCards(itemsArray);
                })
                .catch(error => {
                    console.error(error);
                    let friendlyMsg = `🚫 读取 ${jsonPath} 失败。<br>`;
                    if (!location.hostname.includes('github') && !location.hostname.includes('localhost')) {
                        friendlyMsg += '请确认文件存在且同目录，或启用了正确的路由。';
                    } else {
                        friendlyMsg += '详情：' + error.message;
                    }
                    grid.innerHTML = `<div class="error-message">${friendlyMsg}</div>`;
                });
            }

            // 执行加载
            loadJSONData();

            // 可选：如果您想直接嵌入一个示例 JSON 以防找不到文件（调试用），但这里保留纯净 fetch
            // 若希望后备显示示例，也可在 fetch 失败时展示硬编码数据。
            // 但题目要求「用 github.io 搭配 json 文件里面的内容生成二维码」，所以严格从 json 读取。
            // 为了体验，假如 fetch 404 咱们可以给提示同时展示 demo 数据。但先尊重 fetch 失败错误。
            // 但是为了首次访问时能直接看到效果（如果仓库内没有放置 qr-data.json），可以放置一个备用数据按钮。
            // 但更好：自动生成一个简单的提示，并让用户知道如何创建 json。
            // 我在下方增加一个小特性：如果 fetch 404 之后，如果 grid 里还是错误信息，加一个建议框，但保持错误可见。
            // 同时可以添加一个“加载演示数据”的按钮，但为了符合题目，不做默认展示。如果需要演示，在 json 存在时自然展示。
        })();
    </script>

    <!-- 添加一段微说明 (若没有json，给用户指引) 但不会覆盖核心功能 -->
    <div style="display: none;">兼容 github pages 部署：请确保 qr-data.json 位于同一目录下</div>
</body>
</html>
