<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练秋湖D组团 · 时段筛选</title>
    <!-- 轻量二维码库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <!-- 简洁样式：羊皮纸风格 + 筛选条 -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #fcf8f0;  /* 羊皮纸底色 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1.5rem;
        }
        .card-grid {
            max-width: 1400px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #5d4a36;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .sub {
            color: #7c6b58;
            font-size: 1.1rem;
            margin-top: 0.2rem;
            border-bottom: 2px solid #e8d9c8;
            padding-bottom: 1rem;
            display: inline-block;
        }

        /* 筛选栏 — 优雅小药丸 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.8rem 1.2rem;
            background: #f5ede1;
            padding: 0.9rem 2rem;
            border-radius: 60px;
            margin: 1.5rem auto 2.2rem auto;
            width: fit-content;
            border: 1px solid #e1d2c0;
            box-shadow: 0 4px 12px rgba(93, 74, 54, 0.08);
        }
        .filter-label {
            font-weight: 500;
            color: #5d4a36;
            font-size: 1rem;
            letter-spacing: 0.3px;
            background: #e8d9c8;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
        }
        .filter-btn {
            background: transparent;
            border: none;
            padding: 0.4rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 40px;
            color: #5d4a36;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
        }
        .filter-btn:hover {
            background: #e8d9c8;
            border-color: #d2bca5;
        }
        .filter-btn.active {
            background: #5d4a36;
            color: #fcf8f0;
            box-shadow: 0 4px 8px rgba(93, 74, 54, 0.3);
            border-color: #5d4a36;
        }
        .filter-clear {
            background: #fff3e0;
            border: 1px solid #d2bca5;
            color: #7c5e40;
            margin-left: 0.5rem;
        }
        .filter-clear:hover {
            background: #f5e5d2;
        }

        /* 卡片网格 — 默认6列 */
        .qr-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1.5rem;
            justify-items: center;
            margin-top: 1rem;
            transition: 0.3s;
        }

        /* 卡片样式 */
        .qr-card {
            background: #fffbf5;
            width: 100%;
            max-width: 220px;
            border-radius: 24px;
            padding: 1.5rem 0.8rem 1.2rem 0.8rem;
            box-shadow: 0 10px 25px -8px rgba(93, 74, 54, 0.15);
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #ede3d6;
        }
        .qr-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 30px -10px rgba(93, 74, 54, 0.25);
            border-color: #dac9b6;
        }
        .qr-canvas-wrap {
            background: #fcf8f0;
            padding: 0.6rem;
            border-radius: 18px;
            box-shadow: inset 0 2px 6px #f0e6d9, 0 6px 10px rgba(93, 74, 54, 0.1);
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        canvas, img {
            width: 140px;
            height: 140px;
            border-radius: 10px;
            display: block;
        }
        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #5d4a36;
            word-break: break-word;
            width: 100%;
            margin-top: 0.3rem;
        }
        /* 时段标记小标签 */
        .period-badge {
            background: #e8d9c8;
            color: #4a3a2a;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            margin-top: 0.3rem;
            display: inline-block;
            letter-spacing: 0.3px;
            border: 1px solid #dac9b6;
        }

        .footer-note {
            text-align: center;
            margin-top: 3rem;
            color: #7c6b58;
            font-size: 0.9rem;
            border-top: 1px solid #e8d9c8;
            padding-top: 1.8rem;
        }

        .loading-placeholder, .error-message {
            grid-column: 1 / -1;
            padding: 3rem;
            font-size: 1.2rem;
            color: #7c6b58;
            text-align: center;
        }
        .error-message {
            background: #fff0e6;
            color: #b3563b;
            border-radius: 2rem;
            border: 1px solid #ffd9c5;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .qr-container { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 800px) {
            .qr-container { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 500px) {
            .qr-container { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="card-grid">
        <div class="header">
            <h1>练秋湖D组团 · 时段房态</h1>
        </div>

        <!-- 筛选按钮动态插入到此区域 -->
        <div id="filterSection" class="filter-bar">
            <span class="filter-label">📅 时段</span>
            <!-- 通过js生成按钮，包含“全部”和各period值 -->
        </div>

        <!-- 二维码卡片网格 -->
        <div id="qrGrid" class="qr-container">
            <div class="loading-placeholder">⏳ 载入 JSON 数据中……</div>
        </div>

        <div class="footer-note">
            🌐 by aki 2026/3/2 · 数据包含 period 分类
        </div>
    </div>

    <script>
        (function() {
            const grid = document.getElementById('qrGrid');
            const filterDiv = document.getElementById('filterSection');

            // 存储原始所有卡片数据 (从JSON解析出来的完整数组)
            let masterData = [];

            // 当前选中的period (null表示全部)
            let currentPeriod = null;

            // ---------- 渲染卡片 (接受过滤后的数据) ----------
            function renderQRCards(items) {
                grid.innerHTML = '';  // 清空

                if (!items || items.length === 0) {
                    grid.innerHTML = `<div class="error-message" style="background: #f5ede1; color: #7c6b58;">📭 没有符合该时段的会议室</div>`;
                    return;
                }

                items.forEach(item => {
                    const room = item.room || '未命名会议室';
                    const code = item.code || '';
                    const period = item.period || '未分类';   // 显示用

                    // 卡片创建
                    const card = document.createElement('div');
                    card.className = 'qr-card';

                    // 二维码区域
                    const qrWrapper = document.createElement('div');
                    qrWrapper.className = 'qr-canvas-wrap';

                    if (!code) {
                        // 无code展示警告
                        qrWrapper.innerHTML = `<span style="font-size:2rem; color:#b3563b;">⚠️</span>`;
                    } else {
                        try {
                            const qr = qrcode(0, 'M');
                            qr.addData(code);
                            qr.make();

                            const canvas = document.createElement('canvas');
                            const cellSize = 4;
                            const size = qr.getModuleCount();
                            canvas.width = size * cellSize;
                            canvas.height = size * cellSize;

                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#fcf8f0';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);

                            ctx.fillStyle = '#5d4a36';
                            for (let row = 0; row < size; row++) {
                                for (let col = 0; col < size; col++) {
                                    if (qr.isDark(row, col)) {
                                        ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                                    }
                                }
                            }
                            qrWrapper.appendChild(canvas);
                        } catch (e) {
                            console.warn('二维码生成失败', e);
                            qrWrapper.innerHTML = `<span style="color:#b3563b;">❌</span>`;
                        }
                    }

                    card.appendChild(qrWrapper);

                    // 标题 + period小标
                    const titleEl = document.createElement('div');
                    titleEl.className = 'card-title';
                    titleEl.textContent = room;

                    const periodEl = document.createElement('div');
                    periodEl.className = 'period-badge';
                    periodEl.textContent = period;   // 直接显示period字段

                    card.appendChild(titleEl);
                    card.appendChild(periodEl);
                    grid.appendChild(card);
                });
            }

            // ---------- 更新视图 (根据currentPeriod过滤masterData) ----------
            function updateGridByFilter() {
                if (!masterData.length) {
                    grid.innerHTML = `<div class="loading-placeholder">⏳ 暂无数据</div>`;
                    return;
                }

                let filtered = masterData;
                if (currentPeriod !== null) {
                    filtered = masterData.filter(item => item.period === currentPeriod);
                }
                renderQRCards(filtered);
            }

            // ---------- 生成筛选按钮 (从masterData提取唯一period) ----------
            function buildFilterButtons() {
                // 提取所有period值 (过滤掉空字符串或null，但保留'未分类'等)
                const periodSet = new Set();
                masterData.forEach(item => {
                    // 如果period不存在，可以归为'未指定'；但一般json会有字段
                    if (item.hasOwnProperty('period')) {
                        // 保证字符串，即使是数字也转成字符串
                        periodSet.add(String(item.period));
                    } else {
                        periodSet.add('未指定');
                    }
                });

                // 转换为数组并排序 (可选)
                let periods = Array.from(periodSet).sort((a,b) => a.localeCompare(b));

                // 清空filterDiv，保留左侧的filter-label (手动保留)
                filterDiv.innerHTML = '<span class="filter-label">📅 时段</span>';

                // 添加“全部”按钮 (始终显示)
                const allBtn = document.createElement('button');
                allBtn.className = `filter-btn ${currentPeriod === null ? 'active' : ''}`;
                allBtn.textContent = '全部';
                allBtn.dataset.period = 'null';  // 字符串标记
                allBtn.addEventListener('click', () => {
                    currentPeriod = null;
                    // 按钮激活样式更新
                    updateActiveClass();
                    updateGridByFilter();
                });
                filterDiv.appendChild(allBtn);

                // 添加每个period按钮
                periods.forEach(p => {
                    const btn = document.createElement('button');
                    btn.className = `filter-btn ${currentPeriod === p ? 'active' : ''}`;
                    btn.textContent = p;
                    btn.dataset.period = p;
                    btn.addEventListener('click', () => {
                        currentPeriod = p;
                        updateActiveClass();
                        updateGridByFilter();
                    });
                    filterDiv.appendChild(btn);
                });

                // 添加一个小清除图标(可选) 已经包含全部按钮，所以清除可以用全部替代，但加一个重置更顺手
                const resetBtn = document.createElement('button');
                resetBtn.className = 'filter-btn filter-clear';
                resetBtn.textContent = '↺ 重置';
                resetBtn.addEventListener('click', () => {
                    currentPeriod = null;
                    updateActiveClass();
                    updateGridByFilter();
                });
                filterDiv.appendChild(resetBtn);

                function updateActiveClass() {
                    // 遍历所有按钮，设置active
                    Array.from(filterDiv.querySelectorAll('.filter-btn')).forEach(btn => {
                        if (btn.dataset.period === 'null' && currentPeriod === null) {
                            btn.classList.add('active');
                        } else if (btn.dataset.period !== 'null' && btn.dataset.period === currentPeriod) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    });
                }
            }

            // ---------- 加载JSON数据 ----------
            function loadJSONData() {
                const jsonPath = 'qr-data.json';  // 相对路径，适合github.io

                fetch(jsonPath, { method: 'GET', headers: { 'Accept': 'application/json' } })
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status} — 无法加载 ${jsonPath}`);
                    return response.json();
                })
                .then(data => {
                    // 解析数组 (兼容多种字段)
                    let itemsArray = null;
                    if (Array.isArray(data)) {
                        itemsArray = data;
                    } else if (data && Array.isArray(data.items)) {
                        itemsArray = data.items;
                    } else if (data && Array.isArray(data.rooms)) {
                        itemsArray = data.rooms;
                    } else if (data && Array.isArray(data.data)) {
                        itemsArray = data.data;
                    } else {
                        // 尝试取第一个数组字段
                        for (let key in data) {
                            if (Array.isArray(data[key])) {
                                itemsArray = data[key];
                                break;
                            }
                        }
                    }

                    if (!itemsArray) {
                        grid.innerHTML = `<div class="error-message">❌ JSON 中未找到数组数据。需要包含 room, code, period 的数组。</div>`;
                        return;
                    }

                    // 保存到masterData，并保证每条至少包含room/code/period（缺失则补默认）
                    masterData = itemsArray.map((item, idx) => {
                        return {
                            room: item.room || `会议室-${idx+1}`,
                            code: item.code || '',
                            period: item.period !== undefined ? String(item.period) : '未指定'
                        };
                    });

                    // 如果没有任何数据
                    if (masterData.length === 0) {
                        grid.innerHTML = `<div class="error-message">📂 数组为空，请添加数据</div>`;
                        return;
                    }

                    // 构建筛选按钮 (必须先有masterData)
                    buildFilterButtons();

                    // 初始显示全部 (currentPeriod = null)
                    updateGridByFilter();
                })
                .catch(error => {
                    console.error(error);
                    grid.innerHTML = `<div class="error-message">🚫 读取 ${jsonPath} 失败。<br>请确认文件存在且格式正确。详情：${error.message}</div>`;
                });
            }

            // 开始加载
            loadJSONData();
        })();
    </script>
</body>
</html>
