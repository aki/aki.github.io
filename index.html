<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练秋湖D组团 · 下拉周期</title>
    <!-- 轻量二维码库 (qrcode-generator) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <!-- 简洁样式：羊皮纸风格 + 下拉周期 + 正则输入框 -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #fcf8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1.5rem;
        }
        .card-grid {
            max-width: 1400px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #5d4a36;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .sub {
            color: #7c6b58;
            font-size: 1.1rem;
            margin-top: 0.2rem;
            border-bottom: 2px solid #e8d9c8;
            padding-bottom: 1rem;
            display: inline-block;
        }

        /* 筛选栏 — 用下拉代替按钮组，保留正则 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.8rem 1.5rem;
            background: #f5ede1;
            padding: 0.9rem 2rem;
            border-radius: 60px;
            margin: 1.5rem auto 2.2rem auto;
            width: fit-content;
            max-width: 100%;
            border: 1px solid #e1d2c0;
            box-shadow: 0 4px 12px rgba(93, 74, 54, 0.08);
        }
        .filter-label {
            font-weight: 500;
            color: #5d4a36;
            font-size: 1rem;
            letter-spacing: 0.3px;
            background: #e8d9c8;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            white-space: nowrap;
        }
        /* 下拉周期样式 */
        .period-select-wrapper {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: #fffbf5;
            padding: 0.2rem 0.5rem 0.2rem 1rem;
            border-radius: 40px;
            border: 1px solid #d2bca5;
        }
        .period-select {
            background: transparent;
            border: none;
            padding: 0.4rem 1.5rem 0.4rem 0.5rem;
            font-size: 0.95rem;
            color: #5d4a36;
            outline: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235d4a36' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 0.2rem center;
            background-size: 1rem;
        }
        .period-select option {
            background: #fffbf5;
            color: #2d2d2d;
        }
        .reset-btn {
            background: #fff3e0;
            border: 1px solid #d2bca5;
            color: #7c5e40;
            border-radius: 40px;
            padding: 0.4rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.15s;
        }
        .reset-btn:hover {
            background: #f5e5d2;
        }

        /* 正则输入框区域 */
        .regex-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #fffbf5;
            padding: 0.2rem 0.5rem 0.2rem 1rem;
            border-radius: 40px;
            border: 1px solid #d2bca5;
        }
        .regex-icon {
            color: #7c6b58;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
        }
        #regexInput {
            border: none;
            background: transparent;
            padding: 0.4rem 0.2rem;
            font-size: 0.95rem;
            outline: none;
            color: #5d4a36;
            min-width: 160px;
            font-family: 'Courier New', monospace;
        }
        #regexInput::placeholder {
            color: #b9a792;
            font-style: italic;
            font-family: 'Segoe UI', sans-serif;
        }
        .regex-clear {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #a48e78;
            padding: 0 0.3rem;
            border-radius: 50%;
            line-height: 1;
        }
        .regex-clear:hover {
            color: #5d4a36;
            background: #ede3d6;
        }

        /* 卡片网格 */
        .qr-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1.5rem;
            justify-items: center;
            margin-top: 1rem;
            transition: 0.3s;
        }

        .qr-card {
            background: #fffbf5;
            width: 100%;
            max-width: 220px;
            border-radius: 24px;
            padding: 1.5rem 0.8rem 1.2rem 0.8rem;
            box-shadow: 0 10px 25px -8px rgba(93, 74, 54, 0.15);
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #ede3d6;
        }
        .qr-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 30px -10px rgba(93, 74, 54, 0.25);
            border-color: #dac9b6;
        }
        .qr-canvas-wrap {
            background: #fcf8f0;
            padding: 0.6rem;
            border-radius: 18px;
            box-shadow: inset 0 2px 6px #f0e6d9, 0 6px 10px rgba(93, 74, 54, 0.1);
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        canvas, img {
            width: 140px;
            height: 140px;
            border-radius: 10px;
            display: block;
        }
        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #5d4a36;
            word-break: break-word;
            width: 100%;
            margin-top: 0.3rem;
        }
        .period-badge {
            background: #e8d9c8;
            color: #4a3a2a;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            margin-top: 0.3rem;
            display: inline-block;
            letter-spacing: 0.3px;
            border: 1px solid #dac9b6;
        }

        .footer-note {
            text-align: center;
            margin-top: 3rem;
            color: #7c6b58;
            font-size: 0.9rem;
            border-top: 1px solid #e8d9c8;
            padding-top: 1.8rem;
        }

        .loading-placeholder, .error-message {
            grid-column: 1 / -1;
            padding: 3rem;
            font-size: 1.2rem;
            color: #7c6b58;
            text-align: center;
        }
        .error-message {
            background: #fff0e6;
            color: #b3563b;
            border-radius: 2rem;
            border: 1px solid #ffd9c5;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .qr-container { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 800px) {
            .qr-container { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 500px) {
            .qr-container { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="card-grid">
        <div class="header">
            <h1>练秋湖D组团 · 周期下拉</h1>
            <div class="sub">🏷️ 会议室二维码 · 下拉周期 + 正则筛选</div>
        </div>

        <!-- 筛选栏：周期下拉 + 重置 + 正则输入框 (动态生成时填充) -->
        <div id="filterBar" class="filter-bar">
            <span class="filter-label">📅 周期</span>
            <!-- 下拉会动态生成在此处，重置按钮也动态插入，正则同样 -->
        </div>

        <!-- 二维码卡片网格 -->
        <div id="qrGrid" class="qr-container">
            <div class="loading-placeholder">⏳ 载入 CSV 数据中……</div>
        </div>

        <div class="footer-note">
            🌐 by aki · 周期下拉版 · 2026/3/3
        </div>
    </div>

    <script>
        (function() {
            const grid = document.getElementById('qrGrid');
            const filterBar = document.getElementById('filterBar');

            // 原始数据
            let masterData = [];

            // 当前选中的周期 (null = 全部)
            let currentPeriod = null;
            // 当前正则字符串
            let currentRegex = '';

            // 防抖timer
            let debounceTimer = null;

            // DOM元素引用 (后续赋值)
            let periodSelect = null;
            let regexInput = null;

            // ---------- 工具函数：渲染卡片 ----------
            function renderQRCards(items) {
                grid.innerHTML = '';

                if (!items || items.length === 0) {
                    grid.innerHTML = `<div class="error-message" style="background: #f5ede1; color: #7c6b58;">📭 没有符合该时段 + 正则条件的会议室</div>`;
                    return;
                }

                items.forEach(item => {
                    const room = item.room || '未命名会议室';
                    const code = item.code || '';
                    const period = item.period || '未分类';

                    const card = document.createElement('div');
                    card.className = 'qr-card';

                    const qrWrapper = document.createElement('div');
                    qrWrapper.className = 'qr-canvas-wrap';

                    if (!code) {
                        qrWrapper.innerHTML = `<span style="font-size:2rem; color:#b3563b;">⚠️</span>`;
                    } else {
                        try {
                            const qr = qrcode(0, 'M');
                            qr.addData(code);
                            qr.make();

                            const canvas = document.createElement('canvas');
                            const cellSize = 4;
                            const size = qr.getModuleCount();
                            canvas.width = size * cellSize;
                            canvas.height = size * cellSize;

                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#fcf8f0';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);

                            ctx.fillStyle = '#5d4a36';
                            for (let row = 0; row < size; row++) {
                                for (let col = 0; col < size; col++) {
                                    if (qr.isDark(row, col)) {
                                        ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                                    }
                                }
                            }
                            qrWrapper.appendChild(canvas);
                        } catch (e) {
                            console.warn('二维码生成失败', e);
                            qrWrapper.innerHTML = `<span style="color:#b3563b;">❌</span>`;
                        }
                    }

                    card.appendChild(qrWrapper);

                    const titleEl = document.createElement('div');
                    titleEl.className = 'card-title';
                    titleEl.textContent = room;

                    const periodEl = document.createElement('div');
                    periodEl.className = 'period-badge';
                    periodEl.textContent = period;

                    card.appendChild(titleEl);
                    card.appendChild(periodEl);
                    grid.appendChild(card);
                });
            }

            // ---------- 过滤逻辑 (period + 正则) ----------
            function getFilteredData() {
                if (!masterData.length) return [];

                let filtered = masterData;

                // 周期过滤 (currentPeriod === null 代表全部)
                if (currentPeriod !== null) {
                    filtered = filtered.filter(item => item.period === currentPeriod);
                }

                // 正则过滤
                if (currentRegex.trim() !== '') {
                    try {
                        const regex = new RegExp(currentRegex, 'i');
                        filtered = filtered.filter(item => regex.test(item.room));
                    } catch (e) {
                        console.warn('无效的正则表达式:', currentRegex, e);
                        // 正则无效，暂时不应用过滤，保持原filtered
                        // 可以在输入框样式提示，略
                    }
                }
                return filtered;
            }

            // 更新网格
            function updateGrid() {
                if (!masterData.length) {
                    grid.innerHTML = `<div class="loading-placeholder">⏳ 暂无数据</div>`;
                    return;
                }
                const filtered = getFilteredData();
                renderQRCards(filtered);
            }

            function debouncedUpdate() {
                if (debounceTimer) clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    updateGrid();
                }, 300);
            }

            // ---------- 构建新式筛选条：下拉周期 + 重置 + 正则输入 ----------
            function buildFilterControls() {
                // 清空filterBar，保留最前面的 label (手动重建)
                filterBar.innerHTML = '<span class="filter-label">📅 周期</span>';

                // 1. 创建下拉容器
                const selectWrapper = document.createElement('div');
                selectWrapper.className = 'period-select-wrapper';

                const selectEl = document.createElement('select');
                selectEl.className = 'period-select';
                selectEl.id = 'periodSelect';
                selectWrapper.appendChild(selectEl);
                filterBar.appendChild(selectWrapper);

                // 2. 重置按钮
                const resetBtn = document.createElement('button');
                resetBtn.className = 'reset-btn';
                resetBtn.textContent = '↺ 重置筛选';
                filterBar.appendChild(resetBtn);

                // 3. 正则输入包装
                const regexWrapper = document.createElement('div');
                regexWrapper.className = 'regex-wrapper';
                regexWrapper.innerHTML = `
                    <span class="regex-icon">🔍 regex</span>
                    <input type="text" id="regexInput" placeholder="房间名正则 (如 101|202)" value="">
                    <button class="regex-clear" id="regexClearBtn" title="清除正则">✕</button>
                `;
                filterBar.appendChild(regexWrapper);

                // 获取元素引用
                periodSelect = document.getElementById('periodSelect');
                regexInput = document.getElementById('regexInput');
                const regexClear = document.getElementById('regexClearBtn');

                // --- 填充下拉选项 (从masterData提取唯一period) ---
                function populateSelect() {
                    if (!masterData.length) return;
                    const periodSet = new Set(masterData.map(item => String(item.period)));
                    const periods = Array.from(periodSet).sort((a, b) => a.localeCompare(b));

                    // 保存当前选中的值 (尝试保持)
                    const oldVal = periodSelect.value;

                    periodSelect.innerHTML = ''; // 清空

                    // 添加“全部”选项，值为空字符串 (代表null)
                    const allOption = document.createElement('option');
                    allOption.value = '';
                    allOption.textContent = '全部周期';
                    periodSelect.appendChild(allOption);

                    periods.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p;
                        opt.textContent = p;
                        periodSelect.appendChild(opt);
                    });

                    // 恢复选中状态：如果currentPeriod有值且存在于选项中，否则置为全部
                    if (currentPeriod !== null && periods.includes(currentPeriod)) {
                        periodSelect.value = currentPeriod;
                    } else {
                        periodSelect.value = '';
                        currentPeriod = null;  // 同步
                    }
                }

                // 首次填充
                if (masterData.length) populateSelect();

                // --- 监听下拉改变 ---
                periodSelect.addEventListener('change', (e) => {
                    const val = e.target.value;
                    // 空字符串代表全部
                    currentPeriod = val === '' ? null : val;
                    updateGrid(); // 不防抖，直接更新
                });

                // --- 监听正则输入 ---
                regexInput.addEventListener('input', (e) => {
                    currentRegex = e.target.value;
                    debouncedUpdate();
                });

                // 清除正则
                regexClear.addEventListener('click', () => {
                    regexInput.value = '';
                    currentRegex = '';
                    updateGrid(); // 立即更新
                    regexInput.focus();
                });

                // --- 重置按钮：清空周期 (设为全部) 和 清空正则 ---
                resetBtn.addEventListener('click', () => {
                    // 周期重置为全部
                    periodSelect.value = '';
                    currentPeriod = null;

                    // 正则重置
                    regexInput.value = '';
                    currentRegex = '';

                    updateGrid();
                });

                // 如果后续masterData更新（本例只加载一次），但保留动态增加能力（一般不需要，但假如未来重新填充可调用populate）
                // 为了一致，暴露给load
                window._refreshPeriodSelect = populateSelect;
            }

            // ---------- CSV解析 (与之前相同) ----------
            function parseCSV(csvText) {
                const lines = [];
                const rawLines = csvText.split(/\r?\n/);
                for (let line of rawLines) {
                    if (line.trim() === '') continue;
                    lines.push(line);
                }

                if (lines.length < 2) {
                    throw new Error('CSV至少需要一行标题+一行数据');
                }

                function parseCSVLine(line) {
                    const result = [];
                    let current = '';
                    let inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const ch = line[i];
                        if (ch === '"') {
                            if (inQuotes && line[i+1] === '"') {
                                current += '"';
                                i++;
                            } else {
                                inQuotes = !inQuotes;
                            }
                        } else if (ch === ',' && !inQuotes) {
                            result.push(current);
                            current = '';
                        } else {
                            current += ch;
                        }
                    }
                    result.push(current);
                    return result;
                }

                const header = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
                let roomIdx = header.findIndex(h => h === 'room' || h === '会议室' || h === '名称');
                let codeIdx = header.findIndex(h => h === 'code' || h === '二维码' || h === 'qr' || h === '内容');
                let periodIdx = header.findIndex(h => h === 'period' || h === '时段' || h === '时间段');

                if (roomIdx === -1 && codeIdx === -1 && periodIdx === -1 && header.length >= 3) {
                    console.warn('未找到标准列名，尝试按顺序映射 (第1列->room, 第2列->code, 第3列->period)');
                    roomIdx = 0;
                    codeIdx = 1;
                    periodIdx = 2;
                }

                if (roomIdx === -1 || codeIdx === -1 || periodIdx === -1) {
                    throw new Error('CSV缺少必要的列(room, code, period)');
                }

                const dataRows = [];
                for (let i = 1; i < lines.length; i++) {
                    const values = parseCSVLine(lines[i]);
                    while (values.length < header.length) values.push('');
                    const roomVal = values[roomIdx] ? values[roomIdx].trim() : `会议室-${i}`;
                    const codeVal = values[codeIdx] ? values[codeIdx].trim() : '';
                    const periodVal = values[periodIdx] ? values[periodIdx].trim() : '未指定';

                    dataRows.push({
                        room: roomVal,
                        code: codeVal,
                        period: periodVal || '未指定'
                    });
                }
                return dataRows;
            }

            // ---------- 加载CSV数据 ----------
            function loadCSVData() {
                const csvPath = 'data';  // 同目录下 data 文件 (无后缀，与原逻辑一致)

                fetch(csvPath, { method: 'GET', headers: { 'Accept': 'text/csv' } })
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status} — 无法加载 ${csvPath}`);
                    return response.text();
                })
                .then(csvText => {
                    let parsedData;
                    try {
                        parsedData = parseCSV(csvText);
                    } catch (parseErr) {
                        grid.innerHTML = `<div class="error-message">❌ CSV 解析失败: ${parseErr.message}</div>`;
                        return;
                    }

                    if (!parsedData || parsedData.length === 0) {
                        grid.innerHTML = `<div class="error-message">📂 CSV 解析后无数据行，请检查文件内容。</div>`;
                        return;
                    }

                    masterData = parsedData;

                    // 构建下拉控件 (第一次调用)
                    buildFilterControls();

                    // 确保周期下拉填充 (如果masterData变化，但之前已经调用buildFilterControls，内部会调用populateSelect? 在build里根据masterData填充)
                    // 但我们在build里第一次填充过，而且数据已经存在；如果masterData之后又有变化(此处一次性)，可以手动刷新下拉
                    if (window._refreshPeriodSelect) window._refreshPeriodSelect();

                    // 初始更新网格
                    updateGrid();
                })
                .catch(error => {
                    console.error(error);
                    grid.innerHTML = `<div class="error-message">🚫 读取 ${csvPath} 失败。<br>请确认文件存在且格式正确。详情：${error.message}</div>`;
                });
            }

            // 开始加载
            loadCSVData();
        })();
    </script>
</body>
</html>
