<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练秋湖D组团</title>
    <!-- 使用轻量的 QR 库 qrcode-generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <!-- 简单样式，干净卡片布局 -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #fcf8f0;  /* 羊皮纸色背景 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .card-grid {
            max-width: 1400px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #5d4a36;  /* 深棕色，配合羊皮纸色调 */
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header h1 span {
            background: #5d4a36;
            color: #fcf8f0;
            font-size: 0.9rem;
            font-weight: 400;
            padding: 0.2rem 1rem;
            border-radius: 30px;
        }
        .sub {
            color: #7c6b58;
            font-size: 1.1rem;
            margin-top: 0.5rem;
            border-bottom: 2px solid #e8d9c8;
            padding-bottom: 1rem;
            display: inline-block;
        }
        /* json 数据源标记 */
        .json-badge {
            background: #f5ede1;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: #5d4a36;
            box-shadow: 0 2px 6px rgba(93, 74, 54, 0.1);
            margin-bottom: 1.8rem;
            border: 1px solid #e8d9c8;
        }
        .json-badge code {
            background: #5d4a36;
            color: #fcf8f0;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        /* 卡片区 - 每行6个 */
        .qr-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);  /* 固定每行6列 */
            gap: 1.5rem;
            justify-items: center;
            margin-top: 1rem;
        }
        .qr-card {
            background: #fffbf5;  /* 浅羊皮纸色 */
            width: 100%;
            max-width: 220px;
            border-radius: 24px;
            padding: 1.5rem 0.8rem 1.2rem 0.8rem;
            box-shadow: 0 10px 25px -8px rgba(93, 74, 54, 0.15);
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #ede3d6;
        }
        .qr-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 30px -10px rgba(93, 74, 54, 0.25);
            border-color: #dac9b6;
        }
        .qr-canvas-wrap {
            background: #fcf8f0;
            padding: 0.6rem;
            border-radius: 18px;
            box-shadow: inset 0 2px 6px #f0e6d9, 0 6px 10px rgba(93, 74, 54, 0.1);
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        canvas, img {
            width: 140px;
            height: 140px;
            border-radius: 10px;
            display: block;
        }
        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #5d4a36;
            word-break: break-word;
            width: 100%;
            margin-top: 0.3rem;
        }
        .footer-note {
            text-align: center;
            margin-top: 3rem;
            color: #7c6b58;
            font-size: 0.9rem;
            border-top: 1px solid #e8d9c8;
            padding-top: 1.8rem;
        }
        .footer-note a {
            color: #8b6f50;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-note a:hover {
            text-decoration: underline;
        }
        .loading-placeholder {
            grid-column: 1 / -1;
            padding: 3rem;
            font-size: 1.2rem;
            color: #7c6b58;
            text-align: center;
        }
        .error-message {
            background: #fff0e6;
            color: #b3563b;
            padding: 2rem;
            border-radius: 2rem;
            grid-column: 1 / -1;
            text-align: center;
            border: 1px solid #ffd9c5;
        }

        /* 响应式处理：当屏幕较小时自动减少列数 */
        @media (max-width: 1200px) {
            .qr-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 800px) {
            .qr-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 500px) {
            .qr-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="card-grid">
        <div class="header">
            <h1>
                练秋湖D组团
        </div>

        <!-- 二维码卡片将动态插入这里 -->
        <div id="qrGrid" class="qr-container">
            <div class="loading-placeholder">⏳ 载入 JSON 数据中……</div>
        </div>

        <div class="footer-note">
            🌐 by aki 2026/3/2
        </div>
    </div>

    <script>
        (function() {
            // 待会要填充的网格容器
            const grid = document.getElementById('qrGrid');

            // 初始化所有二维码的函数 (接收解析后的数组)
            function renderQRCards(items) {
                // 清空 loading 或旧内容
                grid.innerHTML = '';

                // 防御性检查：必须是非空数组
                if (!Array.isArray(items) || items.length === 0) {
                    grid.innerHTML = `<div class="error-message">❌ JSON 数据格式不符：应为包含对象的数组，或数组为空。</div>`;
                    return;
                }

                // 遍历数组，为每一项生成卡片
                items.forEach((item, index) => {
                    // 提取需要的字段：room 作为标题，code 作为二维码内容
                    const room = item.room || '未命名会议室';
                    const code = item.code || '';
                    
                    // 如果code为空，显示警告卡片（但也不显示code原文）
                    if (!code) {
                        const card = document.createElement('div');
                        card.className = 'qr-card';
                        card.innerHTML = `
                            <div class="qr-canvas-wrap" style="background:#f5ede1; padding:1.6rem;">
                                <span style="font-size:2.5rem; color:#b3563b;">⚠️</span>
                            </div>
                            <div class="card-title">${escapeHtml(room)}</div>
                            <div style="color:#b3563b; font-size:0.8rem; margin-top:0.5rem;">暂无二维码内容</div>
                        `;
                        grid.appendChild(card);
                        return;
                    }

                    // 创建卡片外层
                    const card = document.createElement('div');
                    card.className = 'qr-card';
                    
                    // 用于放置二维码的容器
                    const qrWrapper = document.createElement('div');
                    qrWrapper.className = 'qr-canvas-wrap';
                    
                    // 生成二维码 (使用code字段作为内容)
                    try {
                        // 使用 qrcode-generator 库 (全局变量 qrcode)
                        const qr = qrcode(0, 'M');  // 类型0 (自动选择), 纠错级别 M
                        qr.addData(code);
                        qr.make();

                        // 创建 canvas 元素
                        const canvas = document.createElement('canvas');
                        const cellSize = 4;      // 每个点放大倍数
                        const size = qr.getModuleCount();
                        canvas.width = size * cellSize;
                        canvas.height = size * cellSize;

                        const ctx = canvas.getContext('2d');
                        // 绘制羊皮纸色背景
                        ctx.fillStyle = '#fcf8f0';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        // 绘制深色模块 (深棕色)
                        ctx.fillStyle = '#5d4a36';
                        for (let row = 0; row < size; row++) {
                            for (let col = 0; col < size; col++) {
                                if (qr.isDark(row, col)) {
                                    ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                                }
                            }
                        }

                        qrWrapper.appendChild(canvas);
                    } catch (e) {
                        console.warn('二维码生成失败', e);
                        qrWrapper.innerHTML = `<span style="color:#b3563b; padding:1rem;">二维码生成失败</span>`;
                    }

                    // 创建房间名（作为标题）- 只显示这个，不显示code原文
                    const roomEl = document.createElement('div');
                    roomEl.className = 'card-title';
                    roomEl.textContent = room;

                    // 组装卡片 (只有二维码和房间名)
                    card.appendChild(qrWrapper);
                    card.appendChild(roomEl);
                    
                    grid.appendChild(card);
                });
            }

            // 简单的防XSS转义
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return String(unsafe)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // 从相对路径获取 JSON (适合 github.io)
            function loadJSONData() {
                const jsonPath = 'qr-data.json';
                fetch(jsonPath, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} — 无法加载 ${jsonPath}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // 支持多种数据结构：直接数组，或包含items/qrList等数组字段
                    let itemsArray = null;
                    if (Array.isArray(data)) {
                        itemsArray = data;
                    } else if (data && Array.isArray(data.items)) {
                        itemsArray = data.items;
                    } else if (data && Array.isArray(data.rooms)) {
                        itemsArray = data.rooms;
                    } else if (data && Array.isArray(data.data)) {
                        itemsArray = data.data;
                    } else {
                        // 尝试取出第一个值是数组的字段
                        for (let key in data) {
                            if (Array.isArray(data[key])) {
                                itemsArray = data[key];
                                break;
                            }
                        }
                    }

                    if (!itemsArray) {
                        grid.innerHTML = `<div class="error-message">❌ JSON 中未找到数组数据。请确保包含 room/code 字段的数组。</div>`;
                        return;
                    }
                    renderQRCards(itemsArray);
                })
                .catch(error => {
                    console.error(error);
                    let friendlyMsg = `🚫 读取 ${jsonPath} 失败。<br>`;
                    friendlyMsg += '请确认文件存在且格式正确。详情：' + error.message;
                    grid.innerHTML = `<div class="error-message">${friendlyMsg}</div>`;
                });
            }

            // 执行加载
            loadJSONData();
        })();
    </script>
</body>
</html>
