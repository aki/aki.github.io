<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBC 音标训练器</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --ok:#22c55e; --bad:#ef4444; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab { padding:8px 14px; border-radius:999px; background:var(--card); border:1px solid #334155; cursor:pointer; font-size:14px; }
  .tab.active { background:var(--accent); color:#0f172a; border-color:var(--accent); font-weight:600; }
  .panel { display:none; }
  .panel.active { display:block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; }
  .card { background:var(--card); border:1px solid #334155; border-radius:12px; padding:10px; text-align:center; cursor:pointer; transition:.15s; }
  .card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .card .ipa { font-size:22px; font-weight:600; color:var(--accent); }
  .card .word { font-size:13px; color:var(--muted); margin-top:4px; }
  u { text-decoration-color:var(--accent); text-decoration-thickness:2px; text-underline-offset:3px; color:var(--text); font-weight:600; }
  .group-title { font-size:14px; color:var(--muted); margin:18px 0 8px; border-left:3px solid var(--accent); padding-left:8px; }
  .drill { background:var(--card); border:1px solid #334155; border-radius:16px; padding:20px; max-width:520px; }
  .pair { display:flex; gap:12px; justify-content:center; margin:20px 0; }
  .opt { flex:1; padding:18px; border-radius:12px; background:#0f172a; border:2px solid #334155; font-size:22px; cursor:pointer; text-align:center; }
  .opt:hover { border-color:var(--accent); }
  .opt.correct { border-color:var(--ok); background:rgba(34,197,94,.15); }
  .opt.wrong { border-color:var(--bad); background:rgba(239,68,68,.15); }
  .btn { padding:10px 18px; border-radius:10px; border:none; background:var(--accent); color:#0f172a; font-weight:600; cursor:pointer; font-size:14px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid #334155; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .score { font-size:13px; color:var(--muted); }
  .feedback { text-align:center; font-size:15px; min-height:22px; margin-top:8px; }
  .rec-row { display:flex; gap:8px; align-items:center; margin-top:16px; flex-wrap:wrap; }
  audio { height:36px; }
  .target { font-size:28px; text-align:center; color:var(--accent); font-weight:700; margin:8px 0; }
  .hint { font-size:13px; color:var(--muted); text-align:center; }
  .loading { color:var(--accent); font-size:13px; }
</style>
</head>
<body>

<h1>BBC 音标训练器</h1>
<div class="sub">44 音素 · 下划线标出发音字母 · 百度英音发音 · 最小对立听辨 · 录音对比</div>

<div class="tabs">
  <div class="tab active" data-tab="chart">音标表</div>
  <div class="tab" data-tab="drill">听辨练习</div>
  <div class="tab" data-tab="record">录音对比</div>
</div>

<div class="panel active" id="panel-chart"><div id="chart"></div></div>

<div class="panel" id="panel-drill">
  <div class="drill">
    <div class="hint">听发音，选出你听到的单词（点播放，再点选项）</div>
    <div class="pair">
      <div class="opt" id="optA">—</div>
      <div class="opt" id="optB">—</div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="playBtn">▶ 播放</button>
      <button class="btn ghost" id="nextBtn">下一题</button>
      <span class="loading" id="playStatus"></span>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="score" id="score">正确 0 / 0</div>
  </div>
</div>

<div class="panel" id="panel-record">
  <div class="drill">
    <div class="hint">选一个音标，点“播放示范”，再点“录音”跟读，最后回放对比</div>
    <div class="row"><select id="recSelect" class="btn ghost" style="padding:10px"></select></div>
    <div class="target" id="recTarget">/ɪ/</div>
    <div class="hint" id="recWord">ship</div>
    <div class="row">
      <button class="btn" id="playDemo">▶ 播放示范</button>
      <button class="btn ghost" id="recBtn">● 录音</button>
      <button class="btn ghost" id="stopBtn" disabled>■ 停止</button>
      <span class="loading" id="demoStatus"></span>
    </div>
    <div class="rec-row"><span class="hint">我的录音：</span><audio id="myAudio" controls></audio></div>
    <div class="feedback" id="recFeedback"></div>
  </div>
</div>

<script>
// word: 完整单词；u: 要加下划线的片段（发该音标的字母）
const VOWELS = [
  {ipa:'/ɪ/', word:'ship', u:'i', group:'短元音'},
  {ipa:'/ʊ/', word:'book', u:'oo', group:'短元音'},
  {ipa:'/ɒ/', word:'hot', u:'o', group:'短元音'},
  {ipa:'/ʌ/', word:'cup', u:'u', group:'短元音'},
  {ipa:'/ə/', word:'about', u:'a', group:'短元音'},
  {ipa:'/e/', word:'bed', u:'e', group:'短元音'},
  {ipa:'/æ/', word:'cat', u:'a', group:'短元音'},
  {ipa:'/iː/', word:'sheep', u:'ee', group:'长元音'},
  {ipa:'/uː/', word:'food', u:'oo', group:'长元音'},
  {ipa:'/ɔː/', word:'door', u:'oor', group:'长元音'},
  {ipa:'/ɑː/', word:'car', u:'ar', group:'长元音'},
  {ipa:'/ɜː/', word:'bird', u:'ir', group:'长元音'},
  {ipa:'/ɪə/', word:'here', u:'ere', group:'双元音'},
  {ipa:'/ʊə/', word:'tour', u:'our', group:'双元音'},
  {ipa:'/eə/', word:'hair', u:'air', group:'双元音'},
  {ipa:'/eɪ/', word:'day', u:'ay', group:'双元音'},
  {ipa:'/ɔɪ/', word:'boy', u:'oy', group:'双元音'},
  {ipa:'/aɪ/', word:'my', u:'y', group:'双元音'},
  {ipa:'/aʊ/', word:'now', u:'ow', group:'双元音'},
  {ipa:'/əʊ/', word:'go', u:'o', group:'双元音'},
];
const CONSONANTS = [
  {ipa:'/p/', word:'pen', u:'p', group:'清辅音'},
  {ipa:'/t/', word:'tea', u:'t', group:'清辅音'},
  {ipa:'/tʃ/', word:'chair', u:'ch', group:'清辅音'},
  {ipa:'/k/', word:'key', u:'k', group:'清辅音'},
  {ipa:'/f/', word:'fish', u:'f', group:'清辅音'},
  {ipa:'/θ/', word:'think', u:'th', group:'清辅音'},
  {ipa:'/s/', word:'see', u:'s', group:'清辅音'},
  {ipa:'/ʃ/', word:'she', u:'sh', group:'清辅音'},
  {ipa:'/b/', word:'book', u:'b', group:'浊辅音'},
  {ipa:'/d/', word:'dog', u:'d', group:'浊辅音'},
  {ipa:'/dʒ/', word:'job', u:'j', group:'浊辅音'},
  {ipa:'/g/', word:'go', u:'g', group:'浊辅音'},
  {ipa:'/v/', word:'very', u:'v', group:'浊辅音'},
  {ipa:'/ð/', word:'this', u:'th', group:'浊辅音'},
  {ipa:'/z/', word:'zoo', u:'z', group:'浊辅音'},
  {ipa:'/ʒ/', word:'measure', u:'s', group:'浊辅音'},
  {ipa:'/m/', word:'man', u:'m', group:'其他辅音'},
  {ipa:'/n/', word:'no', u:'n', group:'其他辅音'},
  {ipa:'/ŋ/', word:'sing', u:'ng', group:'其他辅音'},
  {ipa:'/h/', word:'hat', u:'h', group:'其他辅音'},
  {ipa:'/l/', word:'leg', u:'l', group:'其他辅音'},
  {ipa:'/r/', word:'red', u:'r', group:'其他辅音'},
  {ipa:'/w/', word:'we', u:'w', group:'其他辅音'},
  {ipa:'/j/', word:'yes', u:'y', group:'其他辅音'},
];
const ALL = [...VOWELS, ...CONSONANTS];

function markWord(item) {
  const i = item.word.indexOf(item.u);
  if (i < 0) return item.word;
  return item.word.slice(0,i) + '<u>' + item.u + '</u>' + item.word.slice(i + item.u.length);
}

// ---------- 百度发音 ----------
let currentAudio = null;
let playSeq = 0;

function baiduSpeak(text, statusEl) {
  // 取消上一次播放
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const seq = ++playSeq;
  const url = 'https://fanyi.baidu.com/gettts?lan=uk&text=' + encodeURIComponent(text) + '&spd=3&source=web';
  if (statusEl) statusEl.textContent = '加载中…';
  const audio = new Audio(url);
  audio.crossOrigin = 'anonymous';
  currentAudio = audio;
  audio.oncanplaythrough = () => { if (statusEl && seq === playSeq) statusEl.textContent = ''; };
  audio.onended = () => { if (statusEl && seq === playSeq) statusEl.textContent = ''; };
  audio.onerror = () => {
    if (statusEl && seq === playSeq) statusEl.textContent = '发音加载失败（网络或接口限制）';
    currentAudio = null;
  };
  const p = audio.play();
  if (p && p.catch) {
    p.catch(() => {
      if (statusEl && seq === playSeq) statusEl.textContent = '播放被拦截，请再点一次';
    });
  }
  return audio;
}

const PAIRS = [
  {a:'ship', b:'sheep', ipaA:'/ɪ/', ipaB:'/iː/'},
  {a:'sit', b:'seat', ipaA:'/ɪ/', ipaB:'/iː/'},
  {a:'fit', b:'feet', ipaA:'/ɪ/', ipaB:'/iː/'},
  {a:'cat', b:'cut', ipaA:'/æ/', ipaB:'/ʌ/'},
  {a:'bed', b:'bad', ipaA:'/e/', ipaB:'/æ/'},
  {a:'full', b:'fool', ipaA:'/ʊ/', ipaB:'/uː/'},
  {a:'hot', b:'hat', ipaA:'/ɒ/', ipaB:'/æ/'},
  {a:'walk', b:'work', ipaA:'/ɔː/', ipaB:'/ɜː/'},
  {a:'think', b:'sink', ipaA:'/θ/', ipaB:'/s/'},
  {a:'this', b:'dis', ipaA:'/ð/', ipaB:'/d/'},
  {a:'she', b:'see', ipaA:'/ʃ/', ipaB:'/s/'},
  {a:'chair', b:'share', ipaA:'/tʃ/', ipaB:'/ʃ/'},
  {a:'job', b:'jog', ipaA:'/dʒ/', ipaB:'/dʒ/'},
  {a:'very', b:'wary', ipaA:'/v/', ipaB:'/w/'},
  {a:'light', b:'right', ipaA:'/l/', ipaB:'/r/'},
];

const chart = document.getElementById('chart');
const groups = [...new Set(ALL.map(x=>x.group))];
groups.forEach(g => {
  const title = document.createElement('div');
  title.className = 'group-title';
  title.textContent = g;
  chart.appendChild(title);
  const grid = document.createElement('div');
  grid.className = 'grid';
  ALL.filter(x=>x.group===g).forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="ipa">${item.ipa}</div><div class="word">${markWord(item)}</div>`;
    card.onclick = () => baiduSpeak(item.word, null);
    grid.appendChild(card);
  });
  chart.appendChild(grid);
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
  };
});

let current = null, answered = false, correctCount = 0, totalCount = 0;

function newQuestion() {
  answered = false;
  document.getElementById('feedback').textContent = '';
  document.getElementById('optA').className = 'opt';
  document.getElementById('optB').className = 'opt';
  document.getElementById('playBtn').disabled = false;
  document.getElementById('playStatus').textContent = '';
  const p = PAIRS[Math.floor(Math.random()*PAIRS.length)];
  const swap = Math.random() < 0.5;
  current = {
    answer: swap ? 'B' : 'A',
    word: swap ? p.b : p.a,
    ipa: swap ? p.ipaB : p.ipaA,
    a: swap ? p.b : p.a,
    b: swap ? p.a : p.b,
    ipaA: swap ? p.ipaB : p.ipaA,
    ipaB: swap ? p.ipaA : p.ipaB
  };
  const itemA = ALL.find(x=>x.word===current.a);
  const itemB = ALL.find(x=>x.word===current.b);
  document.getElementById('optA').innerHTML = (itemA?markWord(itemA):current.a) + `<div style="font-size:12px;color:var(--muted);margin-top:4px">${current.ipaA}</div>`;
  document.getElementById('optB').innerHTML = (itemB?markWord(itemB):current.b) + `<div style="font-size:12px;color:var(--muted);margin-top:4px">${current.ipaB}</div>`;
}

document.getElementById('playBtn').onclick = () => {
  if (current) baiduSpeak(current.word, document.getElementById('playStatus'));
};
document.getElementById('nextBtn').onclick = newQuestion;

function answer(choice) {
  if (!current || answered) return;
  answered = true; totalCount++;
  const fb = document.getElementById('feedback');
  const optA = document.getElementById('optA');
  const optB = document.getElementById('optB');
  if (choice === current.answer) {
    correctCount++;
    (choice==='A'?optA:optB).classList.add('correct');
    fb.textContent = `✅ 正确！是 ${current.word} ${current.ipa}`;
    fb.style.color = 'var(--ok)';
  } else {
    (choice==='A'?optA:optB).classList.add('wrong');
    (current.answer==='A'?optA:optB).classList.add('correct');
    fb.textContent = `❌ 你听到的是 ${current.word} ${current.ipa}`;
    fb.style.color = 'var(--bad)';
  }
  document.getElementById('score').textContent = `正确 ${correctCount} / ${totalCount}`;
  document.getElementById('playBtn').disabled = true;
  setTimeout(newQuestion, 1600);
}
document.getElementById('optA').onclick = () => answer('A');
document.getElementById('optB').onclick = () => answer('B');

const recSelect = document.getElementById('recSelect');
ALL.forEach((item, i) => {
  const o = document.createElement('option');
  o.value = i;
  o.textContent = `${item.ipa}  ${item.word}`;
  recSelect.appendChild(o);
});

let mediaRecorder = null, chunks = [], stream = null;

function updateRecordTarget() {
  const item = ALL[recSelect.value];
  document.getElementById('recTarget').textContent = item.ipa;
  document.getElementById('recWord').innerHTML = markWord(item);
  document.getElementById('recFeedback').textContent = '';
  document.getElementById('demoStatus').textContent = '';
  document.getElementById('myAudio').src = '';
}
recSelect.onchange = updateRecordTarget;
updateRecordTarget();

document.getElementById('playDemo').onclick = () => {
  baiduSpeak(ALL[recSelect.value].word, document.getElementById('demoStatus'));
};

document.getElementById('recBtn').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream);
    chunks = [];
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, {type:'audio/webm'});
      document.getElementById('myAudio').src = URL.createObjectURL(blob);
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start();
    document.getElementById('recBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    document.getElementById('recFeedback').textContent = '录音中… 跟读后点停止';
    document.getElementById('recFeedback').style.color = 'var(--accent)';
  } catch(e) {
    document.getElementById('recFeedback').textContent = '无法访问麦克风，请检查浏览器权限';
    document.getElementById('recFeedback').style.color = 'var(--bad)';
  }
};

document.getElementById('stopBtn').onclick = () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  document.getElementById('recBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('recFeedback').textContent = '回放对比：先听示范，再听自己的';
  document.getElementById('recFeedback').style.color = 'var(--muted)';
};

newQuestion();
</script>
</body>
</html>
