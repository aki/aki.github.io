<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sounds of English - BBC 英式音标发音</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: #eef2f6;
            border: 2px solid #5bc0de;
            border-radius: 24px;
            padding: 30px 35px 25px 35px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 400;
            color: #1e2b3a;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #1e2b3a;
            margin: 15px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section {
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .row-label {
            font-size: 1rem;
            color: #2b3e50;
            min-width: 100px;
            font-weight: 500;
            margin-right: 5px;
        }

        .symbol-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 64px;
            height: 64px;
            background: white;
            border: 2px solid #5bc0de;
            border-radius: 12px;
            font-size: 1.8rem;
            font-weight: 400;
            color: #1e2b3a;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            font-family: 'Times New Roman', 'Segoe UI', serif;
            line-height: 1;
            padding: 5px;
            position: relative;
        }

        .symbol-btn:hover {
            background: #d9edf7;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(91, 192, 222, 0.3);
        }

        .symbol-btn:active, .symbol-btn.active {
            background: #5bc0de;
            color: white;
            border-color: #46b8da;
            transform: scale(0.95);
        }

        .subgroup {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .subgroup .symbol-btn {
            width: 58px;
            height: 58px;
            font-size: 1.6rem;
        }

        .tag {
            font-size: 0.9rem;
            color: #4a5c6e;
            margin-left: 10px;
            font-style: italic;
            min-width: 70px;
        }

        /* 单词展示区域样式 */
        .word-display-area {
            margin-top: 20px;
            min-height: 80px;
            padding: 15px 20px;
            background: #fff;
            border-radius: 16px;
            border: 2px dashed #bce8f1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            transition: all 0.3s ease;
        }

        .word-display-area.empty {
            justify-content: center;
            color: #a0b2c6;
            font-style: italic;
            font-size: 1rem;
            border-color: #d1e3ef;
        }

        .word-card {
            display: flex;
            align-items: center;
            gap: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .word-card .current-symbol-large {
            font-family: 'Times New Roman', serif;
            font-size: 2.5rem;
            color: #46b8da;
            font-weight: bold;
            min-width: 60px;
        }

        .word-card .word-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .word-card .word-btn {
            font-size: 1.6rem;
            font-weight: 500;
            color: #1e2b3a;
            background: #f0f7fa;
            border: 1px solid #bce8f1;
            border-radius: 8px;
            padding: 5px 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .word-card .word-btn:hover {
            background: #5bc0de;
            color: white;
        }

        .word-card .word-btn .speaker-icon {
            font-size: 1rem;
        }

        .word-card .word-phonetic {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 1.1rem;
            color: #6c7a8a;
            margin-left: 5px;
        }

        .footer {
            text-align: right;
            font-size: 0.85rem;
            color: #6c7a8a;
            margin-top: 20px;
            border-top: 1px solid #cbd7e3;
            padding-top: 12px;
        }

        .footer a {
            color: #2b3e50;
            text-decoration: none;
            border-bottom: 1px dotted #2b3e50;
        }

        @media (max-width: 700px) {
            .container { padding: 20px; }
            .symbol-btn { width: 52px; height: 52px; font-size: 1.5rem; }
            .subgroup .symbol-btn { width: 48px; height: 48px; font-size: 1.4rem; }
            .row-label { min-width: 70px; font-size: 0.9rem; }
            .tag { font-size: 0.85rem; margin-left: 5px; min-width: 50px; }
            .word-card { flex-direction: column; align-items: flex-start; gap: 10px; }
            .word-card .word-btn { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sounds of English</h1>

    <!-- 单词展示区域 (默认显示提示) -->
    <div id="wordDisplayArea" class="word-display-area empty">
        点击上方音标，查看示例单词并发音
    </div>

    <!-- 元音部分 -->
    <div class="section">
        <h2>VOWELS</h2>

        <!-- 短元音 -->
        <div class="row">
            <span class="row-label">短元音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="ɪ">ɪ</button>
                <button class="symbol-btn" data-sound="ʊ">ʊ</button>
                <button class="symbol-btn" data-sound="ʌ">ʌ</button>
                <button class="symbol-btn" data-sound="ɒ">ɒ</button>
                <button class="symbol-btn" data-sound="ə">ə</button>
                <button class="symbol-btn" data-sound="e">e</button>
                <button class="symbol-btn" data-sound="æ">æ</button>
            </div>
            <span class="tag">‘short’</span>
        </div>

        <!-- 长元音 -->
        <div class="row">
            <span class="row-label">长元音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="iː">iː</button>
                <button class="symbol-btn" data-sound="uː">uː</button>
                <button class="symbol-btn" data-sound="ɑː">ɑː</button>
                <button class="symbol-btn" data-sound="ɔː">ɔː</button>
                <button class="symbol-btn" data-sound="ɜː">ɜː</button>
            </div>
            <span class="tag">‘long’</span>
        </div>

        <!-- 双元音 -->
        <div class="row">
            <span class="row-label">双元音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="ɪə">ɪə</button>
                <button class="symbol-btn" data-sound="ʊə">ʊə</button>
                <button class="symbol-btn" data-sound="aɪ">aɪ</button>
                <button class="symbol-btn" data-sound="ɔɪ">ɔɪ</button>
                <button class="symbol-btn" data-sound="əʊ">əʊ</button>
                <button class="symbol-btn" data-sound="eə">eə</button>
                <button class="symbol-btn" data-sound="aʊ">aʊ</button>
                <button class="symbol-btn" data-sound="eɪ">eɪ</button>
            </div>
            <span class="tag">diphthongs</span>
        </div>
    </div>

    <!-- 辅音部分 -->
    <div class="section">
        <h2>CONSONANTS</h2>

        <!-- 清辅音 -->
        <div class="row">
            <span class="row-label">清辅音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="p">p</button>
                <button class="symbol-btn" data-sound="t">t</button>
                <button class="symbol-btn" data-sound="tʃ">tʃ</button>
                <button class="symbol-btn" data-sound="k">k</button>
                <button class="symbol-btn" data-sound="f">f</button>
                <button class="symbol-btn" data-sound="θ">θ</button>
                <button class="symbol-btn" data-sound="s">s</button>
                <button class="symbol-btn" data-sound="ʃ">ʃ</button>
            </div>
            <span class="tag">voiceless</span>
        </div>

        <!-- 浊辅音 -->
        <div class="row">
            <span class="row-label">浊辅音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="b">b</button>
                <button class="symbol-btn" data-sound="d">d</button>
                <button class="symbol-btn" data-sound="dʒ">dʒ</button>
                <button class="symbol-btn" data-sound="g">g</button>
                <button class="symbol-btn" data-sound="v">v</button>
                <button class="symbol-btn" data-sound="ð">ð</button>
                <button class="symbol-btn" data-sound="z">z</button>
                <button class="symbol-btn" data-sound="ʒ">ʒ</button>
            </div>
            <span class="tag">voiced</span>
        </div>

        <!-- 其他辅音 -->
        <div class="row">
            <span class="row-label">其他辅音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="m">m</button>
                <button class="symbol-btn" data-sound="n">n</button>
                <button class="symbol-btn" data-sound="ŋ">ŋ</button>
                <button class="symbol-btn" data-sound="h">h</button>
                <button class="symbol-btn" data-sound="l">l</button>
                <button class="symbol-btn" data-sound="r">r</button>
                <button class="symbol-btn" data-sound="w">w</button>
                <button class="symbol-btn" data-sound="j">j</button>
            </div>
            <span class="tag">other</span>
        </div>
    </div>

    <div class="footer">
        <span>发音基于浏览器语音合成 (TTS) · 参考: <a href="https://www.bbc.co.uk/learningenglish/english/features/pronunciation" target="_blank">BBC Learning English</a></span>
    </div>
</div>

<script>
    (function() {
        // 定义每个音标对应的示例单词及单词音标（基于BBC示例）
        const wordData = {
            // 短元音
            'ɪ': { word: 'kit', phonetic: '/kɪt/' },
            'ʊ': { word: 'book', phonetic: '/bʊk/' },
            'ʌ': { word: 'cup', phonetic: '/kʌp/' },
            'ɒ': { word: 'lot', phonetic: '/lɒt/' },
            'ə': { word: 'about', phonetic: '/əˈbaʊt/' },
            'e': { word: 'bed', phonetic: '/bed/' },
            'æ': { word: 'cat', phonetic: '/kæt/' },
            // 长元音
            'iː': { word: 'see', phonetic: '/siː/' },
            'uː': { word: 'food', phonetic: '/fuːd/' },
            'ɑː': { word: 'car', phonetic: '/kɑː/' },
            'ɔː': { word: 'ball', phonetic: '/bɔːl/' },
            'ɜː': { word: 'bird', phonetic: '/bɜːd/' },
            // 双元音
            'ɪə': { word: 'near', phonetic: '/nɪə/' },
            'ʊə': { word: 'tour', phonetic: '/tʊə/' },
            'aɪ': { word: 'time', phonetic: '/taɪm/' },
            'ɔɪ': { word: 'boy', phonetic: '/bɔɪ/' },
            'əʊ': { word: 'go', phonetic: '/ɡəʊ/' },
            'eə': { word: 'hair', phonetic: '/heə/' },
            'aʊ': { word: 'now', phonetic: '/naʊ/' },
            'eɪ': { word: 'name', phonetic: '/neɪm/' },
            // 清辅音
            'p': { word: 'pen', phonetic: '/pen/' },
            't': { word: 'ten', phonetic: '/ten/' },
            'tʃ': { word: 'chair', phonetic: '/tʃeə/' },
            'k': { word: 'key', phonetic: '/kiː/' },
            'f': { word: 'fish', phonetic: '/fɪʃ/' },
            'θ': { word: 'think', phonetic: '/θɪŋk/' },
            's': { word: 'sun', phonetic: '/sʌn/' },
            'ʃ': { word: 'she', phonetic: '/ʃiː/' },
            // 浊辅音
            'b': { word: 'bag', phonetic: '/bæɡ/' },
            'd': { word: 'day', phonetic: '/deɪ/' },
            'dʒ': { word: 'jump', phonetic: '/dʒʌmp/' },
            'g': { word: 'girl', phonetic: '/ɡɜːl/' },
            'v': { word: 'very', phonetic: '/ˈveri/' },
            'ð': { word: 'this', phonetic: '/ðɪs/' },
            'z': { word: 'zoo', phonetic: '/zuː/' },
            'ʒ': { word: 'usually', phonetic: '/ˈjuːʒuəli/' },
            // 其他辅音
            'm': { word: 'mother', phonetic: '/ˈmʌðə/' },
            'n': { word: 'nose', phonetic: '/nəʊz/' },
            'ŋ': { word: 'sing', phonetic: '/sɪŋ/' },
            'h': { word: 'hand', phonetic: '/hænd/' },
            'l': { word: 'look', phonetic: '/lʊk/' },
            'r': { word: 'red', phonetic: '/red/' },
            'w': { word: 'water', phonetic: '/ˈwɔːtə/' },
            'j': { word: 'yes', phonetic: '/jes/' }
        };

        // 语音合成函数
        function speak(text, isSymbol = false) {
            if (!window.speechSynthesis) {
                alert('您的浏览器不支持语音合成，建议使用 Chrome / Edge / Safari。');
                return;
            }
            window.speechSynthesis.cancel(); // 取消当前正在播放的语音

            const utterance = new SpeechSynthesisUtterance();
            
            if (isSymbol) {
                // 如果是音标符号，我们将其转换为对应的读音（通过单词提取首音，或特殊处理）
                // 因为 TTS 无法直接读 IPA 符号，我们用一个巧妙的办法：
                // 传入对应的单词，但将语速极快且尽量短，模拟单音？不，更好的办法是使用 SSML 或者直接读符号。
                // 为了满足“只发音标的音”，我们这里使用一个技巧：读取该音标对应的示例单词，但用户听起来是一整个词。
                // 要真正只发单音，纯网页 TTS 很难做到完美，但我们可以通过标签触发。
                // 为了体验更好，这里依然用单词的“首音节”或完整单词来代表，但为了符合要求，我们读单词。
                // 所以这里的 isSymbol 参数实际上不改变 TTS 行为，但我们通过前端显示区分。
            }

            utterance.text = text;
            utterance.lang = 'en-GB'; // 英式发音
            utterance.rate = 0.85;
            utterance.pitch = 1;
            utterance.volume = 1;

            // 尝试寻找英式英语语音
            const voices = window.speechSynthesis.getVoices();
            const gbVoice = voices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB');
            if (gbVoice) {
                utterance.voice = gbVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // 获取 DOM 元素
        const displayArea = document.getElementById('wordDisplayArea');
        const allSymbolBtns = document.querySelectorAll('.symbol-btn');

        // 移除所有按钮的 active 状态
        function removeActiveStates() {
            allSymbolBtns.forEach(btn => btn.classList.remove('active'));
        }

        // 渲染单词卡片
        function renderWordCard(sound) {
            const data = wordData[sound];
            if (!data) return;

            displayArea.classList.remove('empty');
            displayArea.innerHTML = `
                <div class="word-card">
                    <div class="current-symbol-large">/${sound}/</div>
                    <div class="word-info">
                        <button class="word-btn" data-word="${data.word}">
                            ${data.word} <span class="speaker-icon">🔊</span>
                        </button>
                        <div class="word-phonetic">${data.phonetic}</div>
                    </div>
                </div>
            `;

            // 为生成的单词按钮绑定点击事件
            const wordBtn = displayArea.querySelector('.word-btn');
            if (wordBtn) {
                wordBtn.addEventListener('click', function(e) {
                    e.stopPropagation(); // 防止冒泡触发其他事件
                    const wordToSpeak = this.getAttribute('data-word');
                    speak(wordToSpeak, false);
                });
            }
        }

        // 初始化：给所有音标按钮绑定点击事件
        allSymbolBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const sound = this.getAttribute('data-sound');
                const data = wordData[sound];

                // 1. 视觉交互：切换 active 状态
                removeActiveStates();
                this.classList.add('active');

                // 2. 播放发音（这里播放对应示例单词的发音，以便用户听清该音标）
                // 纯前端 TTS 无法做到绝对“只发单音素”，读单词是最贴近的替代方案。
                if (data) {
                    speak(data.word, true);
                } else {
                    // 如果没有对应单词，尝试直接读符号（备选，但效果通常不好）
                    speak(sound, true);
                }

                // 3. 更新下方的单词展示区域
                if (data) {
                    renderWordCard(sound);
                }
            });
        });

        // 预加载语音列表
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }
    })();
</script>
</body>
</html>
