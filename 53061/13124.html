<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sounds of English - 交互式音标发音</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1050px;
            width: 100%;
            background: #eef2f6;
            border: 2px solid #5bc0de;
            border-radius: 24px;
            padding: 30px 35px 25px 35px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative; /* 为内部绝对定位提供参考 */
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 400;
            color: #1e2b3a;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #1e2b3a;
            margin: 15px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section {
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .row-label {
            font-size: 1rem;
            color: #2b3e50;
            min-width: 100px;
            font-weight: 500;
            margin-right: 5px;
        }

        .subgroup {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* 音标按钮 */
        .symbol-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 64px;
            height: 64px;
            background: white;
            border: 2px solid #5bc0de;
            border-radius: 12px;
            font-size: 1.8rem;
            font-weight: 400;
            color: #1e2b3a;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            font-family: 'Times New Roman', 'Segoe UI', serif;
            line-height: 1;
            padding: 5px;
            position: relative; /* 用于定位 */
        }

        .subgroup .symbol-btn {
            width: 58px;
            height: 58px;
            font-size: 1.6rem;
        }

        .symbol-btn:hover {
            background: #d9edf7;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(91, 192, 222, 0.3);
        }

        .symbol-btn.active {
            background: #5bc0de;
            color: white;
            border-color: #46b8da;
            transform: scale(0.95);
        }

        .tag {
            font-size: 0.9rem;
            color: #4a5c6e;
            margin-left: 10px;
            font-style: italic;
            min-width: 70px;
        }

        /* 跟随位置的浮动单词卡片 */
        .floating-card {
            position: absolute;
            z-index: 100;
            background: #fff;
            border: 2px solid #5bc0de;
            border-radius: 12px;
            padding: 12px 18px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none; /* 隐藏时不可点击 */
            transition: opacity 0.2s, transform 0.2s;
            white-space: nowrap;
        }

        /* 指向下方的小三角 */
        .floating-card::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 8px 8px 8px;
            border-style: solid;
            border-color: transparent transparent #5bc0de transparent;
        }

        .floating-card.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto; /* 显示时可点击 */
        }

        .floating-card .card-symbol {
            font-family: 'Times New Roman', serif;
            font-size: 1.8rem;
            color: #46b8da;
            font-weight: bold;
        }

        .floating-card .card-word-btn {
            font-size: 1.4rem;
            font-weight: 500;
            color: #1e2b3a;
            background: #f0f7fa;
            border: 1px solid #bce8f1;
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .floating-card .card-word-btn:hover {
            background: #5bc0de;
            color: white;
        }

        .floating-card .card-word-btn .speaker {
            font-size: 1rem;
        }

        .floating-card .card-phonetic {
            font-size: 1rem;
            color: #6c7a8a;
        }

        .footer {
            text-align: right;
            font-size: 0.85rem;
            color: #6c7a8a;
            margin-top: 20px;
            border-top: 1px solid #cbd7e3;
            padding-top: 12px;
        }

        @media (max-width: 700px) {
            .container { padding: 20px; }
            .symbol-btn { width: 52px; height: 52px; font-size: 1.5rem; }
            .subgroup .symbol-btn { width: 48px; height: 48px; font-size: 1.4rem; }
            .row-label { min-width: 70px; font-size: 0.9rem; }
            .tag { display: none; }
            .floating-card { flex-direction: column; gap: 5px; padding: 10px; }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1>Sounds of English</h1>

    <!-- 跟随音标位置的浮动卡片 (初始隐藏) -->
    <div id="floatingCard" class="floating-card">
        <div class="card-symbol" id="cardSymbol"></div>
        <div>
            <button class="card-word-btn" id="cardWordBtn">
                <span id="cardWordText"></span> <span class="speaker">🔊</span>
            </button>
            <div class="card-phonetic" id="cardPhonetic"></div>
        </div>
    </div>

    <!-- 元音部分 -->
    <div class="section">
        <h2>VOWELS</h2>
        <!-- 短元音 -->
        <div class="row">
            <span class="row-label">短元音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="ɪ">ɪ</button>
                <button class="symbol-btn" data-sound="ʊ">ʊ</button>
                <button class="symbol-btn" data-sound="ʌ">ʌ</button>
                <button class="symbol-btn" data-sound="ɒ">ɒ</button>
                <button class="symbol-btn" data-sound="ə">ə</button>
                <button class="symbol-btn" data-sound="e">e</button>
                <button class="symbol-btn" data-sound="æ">æ</button>
            </div>
            <span class="tag">‘short’</span>
        </div>
        <!-- 长元音 -->
        <div class="row">
            <span class="row-label">长元音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="iː">iː</button>
                <button class="symbol-btn" data-sound="uː">uː</button>
                <button class="symbol-btn" data-sound="ɑː">ɑː</button>
                <button class="symbol-btn" data-sound="ɔː">ɔː</button>
                <button class="symbol-btn" data-sound="ɜː">ɜː</button>
            </div>
            <span class="tag">‘long’</span>
        </div>
        <!-- 双元音 -->
        <div class="row">
            <span class="row-label">双元音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="ɪə">ɪə</button>
                <button class="symbol-btn" data-sound="ʊə">ʊə</button>
                <button class="symbol-btn" data-sound="aɪ">aɪ</button>
                <button class="symbol-btn" data-sound="ɔɪ">ɔɪ</button>
                <button class="symbol-btn" data-sound="əʊ">əʊ</button>
                <button class="symbol-btn" data-sound="eə">eə</button>
                <button class="symbol-btn" data-sound="aʊ">aʊ</button>
                <button class="symbol-btn" data-sound="eɪ">eɪ</button>
            </div>
            <span class="tag">diphthongs</span>
        </div>
    </div>

    <!-- 辅音部分 -->
    <div class="section">
        <h2>CONSONANTS</h2>
        <!-- 清辅音 -->
        <div class="row">
            <span class="row-label">清辅音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="p">p</button>
                <button class="symbol-btn" data-sound="t">t</button>
                <button class="symbol-btn" data-sound="tʃ">tʃ</button>
                <button class="symbol-btn" data-sound="k">k</button>
                <button class="symbol-btn" data-sound="f">f</button>
                <button class="symbol-btn" data-sound="θ">θ</button>
                <button class="symbol-btn" data-sound="s">s</button>
                <button class="symbol-btn" data-sound="ʃ">ʃ</button>
            </div>
            <span class="tag">voiceless</span>
        </div>
        <!-- 浊辅音 -->
        <div class="row">
            <span class="row-label">浊辅音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="b">b</button>
                <button class="symbol-btn" data-sound="d">d</button>
                <button class="symbol-btn" data-sound="dʒ">dʒ</button>
                <button class="symbol-btn" data-sound="g">g</button>
                <button class="symbol-btn" data-sound="v">v</button>
                <button class="symbol-btn" data-sound="ð">ð</button>
                <button class="symbol-btn" data-sound="z">z</button>
                <button class="symbol-btn" data-sound="ʒ">ʒ</button>
            </div>
            <span class="tag">voiced</span>
        </div>
        <!-- 其他辅音 -->
        <div class="row">
            <span class="row-label">其他辅音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="m">m</button>
                <button class="symbol-btn" data-sound="n">n</button>
                <button class="symbol-btn" data-sound="ŋ">ŋ</button>
                <button class="symbol-btn" data-sound="h">h</button>
                <button class="symbol-btn" data-sound="l">l</button>
                <button class="symbol-btn" data-sound="r">r</button>
                <button class="symbol-btn" data-sound="w">w</button>
                <button class="symbol-btn" data-sound="j">j</button>
            </div>
            <span class="tag">other</span>
        </div>
    </div>
    <div class="footer">点击音标听纯音，点击单词听完整发音</div>
</div>

<script>
    (function() {
        // 数据映射：音标 -> 单词、单词音标、用于提取单音的英文拼写近似（辅助 TTS）
        const wordData = {
            'ɪ': { word: 'kit', phonetic: '/kɪt/', ttsStr: 'ih' },
            'ʊ': { word: 'book', phonetic: '/bʊk/', ttsStr: 'oo' },
            'ʌ': { word: 'cup', phonetic: '/kʌp/', ttsStr: 'uh' },
            'ɒ': { word: 'lot', phonetic: '/lɒt/', ttsStr: 'aw' },
            'ə': { word: 'about', phonetic: '/əˈbaʊt/', ttsStr: 'uh' },
            'e': { word: 'bed', phonetic: '/bed/', ttsStr: 'eh' },
            'æ': { word: 'cat', phonetic: '/kæt/', ttsStr: 'a' },
            'iː': { word: 'see', phonetic: '/siː/', ttsStr: 'ee' },
            'uː': { word: 'food', phonetic: '/fuːd/', ttsStr: 'oo' },
            'ɑː': { word: 'car', phonetic: '/kɑː/', ttsStr: 'ah' },
            'ɔː': { word: 'ball', phonetic: '/bɔːl/', ttsStr: 'aw' },
            'ɜː': { word: 'bird', phonetic: '/bɜːd/', ttsStr: 'ur' },
            'ɪə': { word: 'near', phonetic: '/nɪə/', ttsStr: 'ear' },
            'ʊə': { word: 'tour', phonetic: '/tʊə/', ttsStr: 'oor' },
            'aɪ': { word: 'time', phonetic: '/taɪm/', ttsStr: 'eye' },
            'ɔɪ': { word: 'boy', phonetic: '/bɔɪ/', ttsStr: 'oy' },
            'əʊ': { word: 'go', phonetic: '/ɡəʊ/', ttsStr: 'oh' },
            'eə': { word: 'hair', phonetic: '/heə/', ttsStr: 'air' },
            'aʊ': { word: 'now', phonetic: '/naʊ/', ttsStr: 'ow' },
            'eɪ': { word: 'name', phonetic: '/neɪm/', ttsStr: 'ay' },
            'p': { word: 'pen', phonetic: '/pen/', ttsStr: 'p' },
            't': { word: 'ten', phonetic: '/ten/', ttsStr: 't' },
            'tʃ': { word: 'chair', phonetic: '/tʃeə/', ttsStr: 'ch' },
            'k': { word: 'key', phonetic: '/kiː/', ttsStr: 'k' },
            'f': { word: 'fish', phonetic: '/fɪʃ/', ttsStr: 'f' },
            'θ': { word: 'think', phonetic: '/θɪŋk/', ttsStr: 'th' },
            's': { word: 'sun', phonetic: '/sʌn/', ttsStr: 's' },
            'ʃ': { word: 'she', phonetic: '/ʃiː/', ttsStr: 'sh' },
            'b': { word: 'bag', phonetic: '/bæɡ/', ttsStr: 'b' },
            'd': { word: 'day', phonetic: '/deɪ/', ttsStr: 'd' },
            'dʒ': { word: 'jump', phonetic: '/dʒʌmp/', ttsStr: 'j' },
            'g': { word: 'girl', phonetic: '/ɡɜːl/', ttsStr: 'g' },
            'v': { word: 'very', phonetic: '/ˈveri/', ttsStr: 'v' },
            'ð': { word: 'this', phonetic: '/ðɪs/', ttsStr: 'th' },
            'z': { word: 'zoo', phonetic: '/zuː/', ttsStr: 'z' },
            'ʒ': { word: 'usually', phonetic: '/ˈjuːʒuəli/', ttsStr: 'zh' },
            'm': { word: 'mother', phonetic: '/ˈmʌðə/', ttsStr: 'm' },
            'n': { word: 'nose', phonetic: '/nəʊz/', ttsStr: 'n' },
            'ŋ': { word: 'sing', phonetic: '/sɪŋ/', ttsStr: 'ng' },
            'h': { word: 'hand', phonetic: '/hænd/', ttsStr: 'h' },
            'l': { word: 'look', phonetic: '/lʊk/', ttsStr: 'l' },
            'r': { word: 'red', phonetic: '/red/', ttsStr: 'r' },
            'w': { word: 'water', phonetic: '/ˈwɔːtə/', ttsStr: 'w' },
            'j': { word: 'yes', phonetic: '/jes/', ttsStr: 'y' }
        };

        const container = document.getElementById('mainContainer');
        const floatingCard = document.getElementById('floatingCard');
        const cardSymbol = document.getElementById('cardSymbol');
        const cardWordText = document.getElementById('cardWordText');
        const cardPhonetic = document.getElementById('cardPhonetic');
        const cardWordBtn = document.getElementById('cardWordBtn');
        const allBtns = document.querySelectorAll('.symbol-btn');

        let currentActiveBtn = null;

        // 语音合成函数
        function speak(text, isPureSound = false, symbol = '') {
            if (!window.speechSynthesis) {
                alert('您的浏览器不支持语音合成，请使用 Chrome/Edge/Safari。');
                return;
            }
            window.speechSynthesis.cancel(); // 停止当前发音

            const utterance = new SpeechSynthesisUtterance();
            
            if (isPureSound && wordData[symbol]) {
                // 技巧：纯前端无法直接读 IPA，这里传入其拼写近似音（如 'sh' 'ee'），并加快语速、拉长音调，模拟单音
                utterance.text = wordData[symbol].ttsStr;
                utterance.rate = 0.7; // 稍慢以便听清
            } else {
                utterance.text = text;
                utterance.rate = 0.9;
            }

            utterance.lang = 'en-GB'; // 英式英语
            
            // 尝试获取英式语音
            const voices = window.speechSynthesis.getVoices();
            const gbVoice = voices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB');
            if (gbVoice) {
                utterance.voice = gbVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // 定位并显示卡片
        function showCard(btn, sound) {
            const data = wordData[sound];
            if (!data) return;

            // 更新卡片内容
            cardSymbol.textContent = `/${sound}/`;
            cardWordText.textContent = data.word;
            cardPhonetic.textContent = data.phonetic;

            // 计算位置
            const btnRect = btn.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();

            // 使卡片水平居中对齐按钮，垂直在按钮正下方
            const left = (btnRect.left - containerRect.left) + (btnRect.width / 2) - (floatingCard.offsetWidth / 2);
            const top = (btnRect.top - containerRect.top) + btnRect.height + 10;

            // 防止卡片超出容器左边或右边
            let finalLeft = left;
            if (finalLeft < 10) finalLeft = 10;
            if (finalLeft + floatingCard.offsetWidth > containerRect.width - 10) {
                finalLeft = containerRect.width - floatingCard.offsetWidth - 10;
            }

            floatingCard.style.left = `${finalLeft}px`;
            floatingCard.style.top = `${top}px`;
            
            // 显示卡片
            floatingCard.classList.add('active');
        }

        // 隐藏卡片
        function hideCard() {
            floatingCard.classList.remove('active');
            if (currentActiveBtn) {
                currentActiveBtn.classList.remove('active');
                currentActiveBtn = null;
            }
        }

        // 绑定音标点击事件
        allBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                const sound = this.getAttribute('data-sound');

                // 如果点击的是同一个且卡片已展开，则收起
                if (currentActiveBtn === this && floatingCard.classList.contains('active')) {
                    hideCard();
                    return;
                }

                // 移除上一个高亮
                if (currentActiveBtn) {
                    currentActiveBtn.classList.remove('active');
                }
                
                // 高亮当前
                this.classList.add('active');
                currentActiveBtn = this;

                // 1. 发音标的纯音
                speak('', true, sound);

                // 2. 定位并显示单词卡片
                // 稍微延迟一点点，确保卡片 DOM 尺寸计算准确
                requestAnimationFrame(() => {
                    showCard(this, sound);
                });
            });
        });

        // 绑定卡片内单词按钮的点击事件（发单词完整音）
        cardWordBtn.addEventListener('click', function(e) {
            e.stopPropagation(); // 防止点击事件冒泡导致卡片收起
            const wordToSpeak = cardWordText.textContent;
            speak(wordToSpeak, false);
        });

        // 点击页面空白处关闭卡片
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.symbol-btn') && !e.target.closest('.floating-card')) {
                hideCard();
            }
        });

        // 预加载语音引擎
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }
    })();
</script>
</body>
</html>
