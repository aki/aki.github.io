<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sounds of English</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1050px;
            width: 100%;
            background: #eef2f6;
            border: 2px solid #5bc0de;
            border-radius: 24px;
            padding: 30px 35px 25px 35px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative; /* 为内部绝对定位提供参考 */
            margin-bottom: 50px;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 400;
            color: #1e2b3a;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #1e2b3a;
            margin: 15px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section {
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .row-label {
            font-size: 1rem;
            color: #2b3e50;
            min-width: 100px;
            font-weight: 500;
            margin-right: 5px;
        }

        .subgroup {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* 音标按钮 */
        .symbol-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 64px;
            height: 64px;
            background: white;
            border: 2px solid #5bc0de;
            border-radius: 12px;
            font-size: 1.8rem;
            font-weight: 400;
            color: #1e2b3a;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            font-family: 'Times New Roman', 'Segoe UI', serif;
            line-height: 1;
            padding: 5px;
            position: relative;
        }

        .subgroup .symbol-btn {
            width: 58px;
            height: 58px;
            font-size: 1.6rem;
        }

        .symbol-btn:hover {
            background: #d9edf7;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(91, 192, 222, 0.3);
        }

        .symbol-btn.active {
            background: #5bc0de;
            color: white;
            border-color: #46b8da;
            transform: scale(0.95);
        }

        .tag {
            font-size: 0.9rem;
            color: #4a5c6e;
            margin-left: 10px;
            font-style: italic;
            min-width: 70px;
        }

        /* 跟随位置的浮动单词卡片 */
        .floating-card {
            position: absolute;
            z-index: 100;
            background: #fff;
            border: 2px solid #5bc0de;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            min-width: 260px;
            max-width: 320px;
        }

        /* 指向下方的小三角 */
        .floating-card::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 8px 8px 8px;
            border-style: solid;
            border-color: transparent transparent #5bc0de transparent;
        }

        .floating-card.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .card-header {
            font-family: 'Times New Roman', serif;
            font-size: 1.6rem;
            color: #46b8da;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px dashed #e0e9f0;
            padding-bottom: 8px;
        }

        /* 单词列表 */
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* 滚动条美化 */
        .word-list::-webkit-scrollbar {
            width: 5px;
        }
        .word-list::-webkit-scrollbar-thumb {
            background: #bce8f1;
            border-radius: 5px;
        }

        .word-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fbfd;
            border: 1px solid #e1f0f7;
            border-radius: 8px;
            padding: 8px 12px;
            transition: all 0.2s;
        }

        .word-item:hover {
            background: #eef7fa;
            border-color: #bce8f1;
        }

        .word-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .word-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1e2b3a;
        }

        .word-phonetic {
            font-size: 0.9rem;
            color: #6c7a8a;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .play-btn {
            background: white;
            border: 1px solid #5bc0de;
            color: #46b8da;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .play-btn:hover {
            background: #5bc0de;
            color: white;
        }

        .footer {
            text-align: right;
            font-size: 0.85rem;
            color: #6c7a8a;
            margin-top: 20px;
            border-top: 1px solid #cbd7e3;
            padding-top: 12px;
        }

        @media (max-width: 700px) {
            .container { padding: 20px; }
            .symbol-btn { width: 52px; height: 52px; font-size: 1.5rem; }
            .subgroup .symbol-btn { width: 48px; height: 48px; font-size: 1.4rem; }
            .row-label { min-width: 70px; font-size: 0.9rem; }
            .tag { display: none; }
            .floating-card {
                position: fixed; /* 手机端改为屏幕居中弹出 */
                left: 50% !important;
                top: 50% !important;
                transform: translate(-50%, -50%) scale(0.9) !important;
                width: 90%;
                max-width: 350px;
            }
            .floating-card.active {
                transform: translate(-50%, -50%) scale(1) !important;
            }
            .floating-card::before { display: none; } /* 手机端隐藏小三角 */
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1>Sounds of English</h1>

    <!-- 跟随音标位置的浮动卡片 -->
    <div id="floatingCard" class="floating-card">
        <div class="card-header" id="cardHeader"></div>
        <div class="word-list" id="wordList">
            <!-- 单词将由 JS 动态生成 -->
        </div>
    </div>

    <!-- 元音部分 -->
    <div class="section">
        <h2>VOWELS</h2>
        <!-- 短元音 -->
        <div class="row">
            <span class="row-label">短元音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="ɪ">ɪ</button>
                <button class="symbol-btn" data-sound="ʊ">ʊ</button>
                <button class="symbol-btn" data-sound="ʌ">ʌ</button>
                <button class="symbol-btn" data-sound="ɒ">ɒ</button>
                <button class="symbol-btn" data-sound="ə">ə</button>
                <button class="symbol-btn" data-sound="e">e</button>
                <button class="symbol-btn" data-sound="æ">æ</button>
            </div>
            <span class="tag">‘short’</span>
        </div>
        <!-- 长元音 -->
        <div class="row">
            <span class="row-label">长元音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="iː">iː</button>
                <button class="symbol-btn" data-sound="uː">uː</button>
                <button class="symbol-btn" data-sound="ɑː">ɑː</button>
                <button class="symbol-btn" data-sound="ɔː">ɔː</button>
                <button class="symbol-btn" data-sound="ɜː">ɜː</button>
            </div>
            <span class="tag">‘long’</span>
        </div>
        <!-- 双元音 -->
        <div class="row">
            <span class="row-label">双元音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="ɪə">ɪə</button>
                <button class="symbol-btn" data-sound="ʊə">ʊə</button>
                <button class="symbol-btn" data-sound="aɪ">aɪ</button>
                <button class="symbol-btn" data-sound="ɔɪ">ɔɪ</button>
                <button class="symbol-btn" data-sound="əʊ">əʊ</button>
                <button class="symbol-btn" data-sound="eə">eə</button>
                <button class="symbol-btn" data-sound="aʊ">aʊ</button>
                <button class="symbol-btn" data-sound="eɪ">eɪ</button>
            </div>
            <span class="tag">diphthongs</span>
        </div>
    </div>

    <!-- 辅音部分 -->
    <div class="section">
        <h2>CONSONANTS</h2>
        <!-- 清辅音 -->
        <div class="row">
            <span class="row-label">清辅音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="p">p</button>
                <button class="symbol-btn" data-sound="t">t</button>
                <button class="symbol-btn" data-sound="tʃ">tʃ</button>
                <button class="symbol-btn" data-sound="k">k</button>
                <button class="symbol-btn" data-sound="f">f</button>
                <button class="symbol-btn" data-sound="θ">θ</button>
                <button class="symbol-btn" data-sound="s">s</button>
                <button class="symbol-btn" data-sound="ʃ">ʃ</button>
            </div>
            <span class="tag">voiceless</span>
        </div>
        <!-- 浊辅音 -->
        <div class="row">
            <span class="row-label">浊辅音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="b">b</button>
                <button class="symbol-btn" data-sound="d">d</button>
                <button class="symbol-btn" data-sound="dʒ">dʒ</button>
                <button class="symbol-btn" data-sound="g">g</button>
                <button class="symbol-btn" data-sound="v">v</button>
                <button class="symbol-btn" data-sound="ð">ð</button>
                <button class="symbol-btn" data-sound="z">z</button>
                <button class="symbol-btn" data-sound="ʒ">ʒ</button>
            </div>
            <span class="tag">voiced</span>
        </div>
        <!-- 其他辅音 -->
        <div class="row">
            <span class="row-label">其他辅音</span>
            <div class="subgroup">
                <button class="symbol-btn" data-sound="m">m</button>
                <button class="symbol-btn" data-sound="n">n</button>
                <button class="symbol-btn" data-sound="ŋ">ŋ</button>
                <button class="symbol-btn" data-sound="h">h</button>
                <button class="symbol-btn" data-sound="l">l</button>
                <button class="symbol-btn" data-sound="r">r</button>
                <button class="symbol-btn" data-sound="w">w</button>
                <button class="symbol-btn" data-sound="j">j</button>
            </div>
            <span class="tag">other</span>
        </div>
    </div>
    <div class="footer">点击音标听纯音，点击列表内单词听完整发音</div>
</div>

<script>
    (function() {

            'l': { pure: 'l', words: [{ w: 'look', p: '/lʊk/' }, { w: 'light', p: '/laɪt/' }, { w: 'ball', p: '/bɔːl/' }, { w: 'yellow', p: '/ˈjeləʊ/' }] },
            'r': { pure: 'r', words: [{ w: 'red', p: '/red/' }, { w: 'run', p: '/rʌn/' }, { w: 'car', p: '/kɑː/' }, { w: 'sorry', p: '/ˈsɒri/' }] },
            'w': { pure: 'w', words: [{ w: 'water', p: '/ˈwɔːtə/' }, { w: 'we', p: '/wiː/' }, { w: 'window', p: '/ˈwɪndəʊ/' }, { w: 'away', p: '/əˈweɪ/' }] },
            'j': { pure: 'y', words: [{ w: 'yes', p: '/jes/' }, { w: 'you', p: '/juː/' }, { w: 'music', p: '/ˈmjuːzɪk/' }, { w: 'new', p: '/njuː/' }] }
        };

        const container = document.getElementById('mainContainer');
        const floatingCard = document.getElementById('floatingCard');
        const cardHeader = document.getElementById('cardHeader');
        const wordList = document.getElementById('wordList');
        const allBtns = document.querySelectorAll('.symbol-btn');

        let currentActiveBtn = null;

        // 语音合成函数
        function speak(text, isPureSound = false) {
            if (!window.speechSynthesis) {
                alert('您的浏览器不支持语音合成，请使用 Chrome/Edge/Safari。');
                return;
            }
            window.speechSynthesis.cancel(); // 停止当前发音

            const utterance = new SpeechSynthesisUtterance();
            
            if (isPureSound) {
                // 纯音模拟：读 TTS 拼写，略慢
                utterance.text = text;
                utterance.rate = 0.65; 
            } else {
                // 读完整单词
                utterance.text = text;
                utterance.rate = 0.85;
            }

            utterance.lang = 'en-GB'; // 英式发音
            
            const voices = window.speechSynthesis.getVoices();
            const gbVoice = voices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB');
            if (gbVoice) {
                utterance.voice = gbVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // 渲染单词列表并定位卡片
        function showCard(btn, sound) {
            const data = wordData[sound];
            if (!data) return;

            // 渲染头部音标
            cardHeader.textContent = `/${sound}/`;
            
            // 渲染单词列表
            wordList.innerHTML = '';
            data.words.forEach(item => {
                const div = document.createElement('div');
                div.className = 'word-item';
                div.innerHTML = `
                    <div class="word-info">
                        <span class="word-text">${item.w}</span>
                        <span class="word-phonetic">${item.p}</span>
                    </div>
                    <button class="play-btn" data-word="${item.w}">▶</button>
                `;
                // 绑定播放单词事件
                div.querySelector('.play-btn').addEventListener('click', function(e) {
                    e.stopPropagation();
                    speak(item.w, false);
                });
                wordList.appendChild(div);
            });

            // 计算位置并显示卡片
            const btnRect = btn.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();

            // 为了让卡片更好地对齐，我们可以让卡片位于按钮正下方
            const left = (btnRect.left - containerRect.left) + (btnRect.width / 2) - (floatingCard.offsetWidth / 2);
            const top = (btnRect.top - containerRect.top) + btnRect.height + 10;

            // 防止卡片超出左右边界
            let finalLeft = left;
            if (finalLeft < 10) finalLeft = 10;
            if (finalLeft + floatingCard.offsetWidth > containerRect.width - 10) {
                finalLeft = containerRect.width - floatingCard.offsetWidth - 10;
            }

            floatingCard.style.left = `${finalLeft}px`;
            floatingCard.style.top = `${top}px`;
            
            // 显示动画
            floatingCard.classList.add('active');
        }

        function hideCard() {
            floatingCard.classList.remove('active');
            if (currentActiveBtn) {
                currentActiveBtn.classList.remove('active');
                currentActiveBtn = null;
            }
        }

        // 绑定音标点击事件
        allBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                const sound = this.getAttribute('data-sound');
                const data = wordData[sound];

                // 如果点击的是同一个且卡片已展开，则收起
                if (currentActiveBtn === this && floatingCard.classList.contains('active')) {
                    hideCard();
                    return;
                }

                if (currentActiveBtn) currentActiveBtn.classList.remove('active');
                
                this.classList.add('active');
                currentActiveBtn = this;

                // 1. 发纯音
                if (data) speak(data.pure, true);

                // 2. 显示卡片（由于卡片高度会根据单词数量变化，需在 DOM 渲染后计算位置）
                requestAnimationFrame(() => {
                    showCard(this, sound);
                });
            });
        });

        // 点击空白处隐藏
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.symbol-btn') && !e.target.closest('.floating-card')) {
                hideCard();
            }
        });

        // 预加载语音
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }
    })();
</script>
</body>
</html>
